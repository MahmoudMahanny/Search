# Deploy static web app to GitHub Pages (web only — not Android project)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web publish folder
        run: |
          mkdir -p _site
          cp index.html chassis.html history.html settings.html db.js theme.js theme.css update.js data.json _site/
          cp capacitor.js _site/ 2>/dev/null || true
          cp plates.txt.gz android-version.json _site/ 2>/dev/null || true
          mkdir -p _site/vendor
          if [ -f vendor/xlsx.full.min.js ]; then
            cp vendor/xlsx.full.min.js _site/vendor/
          elif [ -f node_modules/xlsx/dist/xlsx.full.min.js ]; then
            cp node_modules/xlsx/dist/xlsx.full.min.js _site/vendor/
          fi
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js _site/capacitor.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
