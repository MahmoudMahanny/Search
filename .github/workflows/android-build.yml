name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "cursor/**"]
    paths:
      - "index.html"
      - "chassis.html"
      - "history.html"
      - "db.js"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammah-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="android-$(date +%Y.%m.%d)-${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk lammah.apk
          gh release create "$VERSION" lammah.apk \
            --title "لمّاح Android $VERSION" \
            --notes "APK مباشر — حمّل lammah.apk من الموبايل بدون فك ضغط."
