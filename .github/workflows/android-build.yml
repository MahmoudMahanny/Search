name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "cursor/**"]
    paths:
      - "index.html"
      - "chassis.html"
      - "history.html"
      - "settings.html"
      - "db.js"
      - "gemini-voice.js"
      - "android/**"
      - "android-version.json"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bump Android version (manual release)
        if: github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="android-v${VERSION_NAME}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/lammah.apk"
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          cat > android-version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "notes": "تحديث جديد — اضغط «تحديث الآن» داخل التطبيق أو حمّل lammah.apk مباشرة."
          }
          EOF
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammah-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk lammah.apk
          gh release create "${{ steps.ver.outputs.tag }}" lammah.apk \
            --title "لمّاح Android ${{ steps.ver.outputs.version_name }}" \
            --notes "APK مباشر — حمّل **lammah.apk** من الموبايل.

          المستخدمون الحاليون: افتحوا التطبيق واضغطوا **«تحديث الآن»** في الإشعار."

      - name: Publish APK to GitHub Release (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(node -pe "JSON.parse(require('fs').readFileSync('android-version.json','utf8')).versionName")
          NOTES=$(node -pe "JSON.parse(require('fs').readFileSync('android-version.json','utf8')).notes || 'تحديث جديد'")
          TAG="android-v${VERSION_NAME}"
          cp android/app/build/outputs/apk/release/app-release.apk lammah.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lammah.apk --clobber
          else
            gh release create "$TAG" lammah.apk \
              --title "لمّاح Android ${VERSION_NAME}" \
              --notes "$NOTES"
          fi

      - name: Commit version manifest after release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android-version.json android/app/build.gradle
          git diff --staged --quiet && exit 0
          git commit -m "chore(android): release ${{ steps.ver.outputs.version_name }}"
          git push
