<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث بالهيكل - طـه</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #eef0f4;
    --muted: #9aa2b1;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .nav-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .nav-link {
    flex: 1;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 13px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .nav-link:active { transform: scale(0.96); }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 10px;
  }
  #chassisInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 17px;
    padding: 10px 4px;
    text-align: center;
    letter-spacing: 0.5px;
    direction: ltr;
    min-width: 0;
  }
  #chassisInput::placeholder {
    color: var(--muted);
    font-size: 14px;
  }
  .icon-btn {
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .icon-btn:active { transform: scale(0.93); }
  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
  .status-line.ok-text { color: var(--good); }
  .results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .result-card.exact {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  .plate-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
    direction: rtl;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
  }
  .field-row:first-of-type { border-top: none; }
  .field-label { color: var(--muted); }
  .field-value { color: var(--text); font-weight: 600; text-align: left; direction: ltr; unicode-bidi: plaintext; }
  .empty-state, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }
  .no-results { color: var(--danger); }
  .count-badge {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔧 بحث بالهيكل / الشاصي</h1>
    <p id="dbCount">جارٍ تحميل قاعدة البيانات...</p>
  </header>

  <div class="nav-row">
    <a href="index.html" class="nav-link">🔍 بحث باللوحة</a>
    <a href="history.html" class="nav-link">📋 عرض السجل</a>
  </div>

  <div class="search-box">
    <div class="input-row">
      <button id="clearBtn" class="icon-btn" title="مسح">✕</button>
      <input id="chassisInput" type="text" placeholder="اكتب رقم الهيكل (الشاصي)" autocomplete="off" />
    </div>
    <div id="statusLine" class="status-line"></div>
  </div>

  <div id="results" class="results"></div>
</div>

<script src="db.js"></script>
<script>
(async function () {
  const dbCountEl = document.getElementById('dbCount');
  const input = document.getElementById('chassisInput');
  const clearBtn = document.getElementById('clearBtn');
  const statusLine = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');

  window.addEventListener('error', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  let rawRecords;
  try {
    const alreadySeeded = await getMeta('seeded');
    if (alreadySeeded) {
      rawRecords = await getAllRecords();
    } else {
      const resp = await fetch('plates.txt.gz');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const isGzipped = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      let text;
      if (isGzipped) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('المتصفح لا يدعم فك الضغط — استخدم كروم حديث');
        }
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([buf]).stream().pipeThrough(ds);
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder('utf-8').decode(bytes);
      }
      const lines = text.split('\n').filter(Boolean);
      const seeded = lines.map(line => {
        const parts = line.split('|');
        const plate = parts[0] || '', type = parts[1] || '', bank = parts[2] || '', chassis = parts[3] || '';
        const normPlate = normalizeText(plate);
        return {
          dedupeKey: normPlate + '|' + normalizeText(chassis) + '|' + normalizeText(bank),
          plate, type, bank, chassis, normPlate, source: 'base'
        };
      });
      await putRecords(seeded);
      await setMeta('seeded', true);
      rawRecords = seeded;
    }
  } catch (err) {
    dbCountEl.textContent = '⚠️ تعذر تحميل قاعدة البيانات (' + err.message + ')';
    return;
  }

  const normDB = rawRecords.map(r => ({
    plate: r.plate || '', type: r.type || '', bank: r.bank || '',
    chassis: r.chassis || '', normChassis: normalizeText(r.chassis || '')
  })).filter(r => r.normChassis);

  dbCountEl.textContent = 'قاعدة البيانات: ' + normDB.length.toLocaleString('ar-EG') + ' سجل فيه رقم هيكل';

  function fieldRow(label, value) {
    return '<div class="field-row"><span class="field-label">' + label + '</span><span class="field-value">' + escapeHtml(String(value)) + '</span></div>';
  }

  function renderEmpty() {
    resultsEl.innerHTML = '<div class="empty-state">اكتب رقم الهيكل (الشاصي) كامل أو جزء منه</div>';
  }

  function renderResults(query) {
    const token = normalizeText(query);
    if (!token) { renderEmpty(); return; }

    const exact = [];
    const partial = [];
    for (const row of normDB) {
      if (row.normChassis === token) exact.push(row);
      else if (row.normChassis.includes(token)) partial.push(row);
    }

    let list = exact.length ? exact : partial.slice(0, 30);
    const seen = new Set();
    list = list.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (list.length === 0) {
      resultsEl.innerHTML = '<div class="no-results">⚠️ مفيش نتيجة مطابقة لـ «' + escapeHtml(query) + '»</div>';
      return;
    }

    const isExact = exact.length > 0;
    let html = '<div class="count-badge">' + (isExact ? '✅ تطابق تام' : '🔎 نتائج قريبة') + ' — ' + list.length + ' نتيجة</div>';
    for (const r of list) {
      html += '<div class="result-card ' + (isExact ? 'exact' : '') + '">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;

    if (isExact) {
      vibrateFound();
      for (const r of exact) {
        addHistoryEntry({
          plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis,
          matchedBy: 'chassis', searchedAt: new Date().toISOString()
        }).catch(() => {});
      }
    }
  }

  let debounceTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = input.value;
    if (!val.trim()) { renderEmpty(); return; }
    debounceTimer = setTimeout(() => renderResults(val), 150);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    renderEmpty();
    statusLine.textContent = '';
    statusLine.className = 'status-line';
    input.focus();
  });

  renderEmpty();
})();
</script>
</body>
</html>
