<meta name="apple-mobile-web-app-title" content="لمّاح">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2b1c'/%3E%3Cpath d='M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z' fill='%23d4af37'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%230e2b1c'/%3E%3C/svg%3E">
<title>لمّاح — بحث بالهيكل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #071a12;
    --panel: #0e2b1c;
    --panel-2: #123423;
    --border: #1f4a34;
    --text: #eef4f0;
    --muted: #8fae9c;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .brand-logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  header h1 {
    font-family: 'Almarai', 'Tajawal', 'Segoe UI', sans-serif;
    font-size: 30px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent);
    line-height: 1;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    min-height: 16px;
  }
  header p:empty { display: none; }
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(14, 43, 28, 0.92);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-top: 1px solid var(--border);
    max-width: 560px;
    margin: 0 auto;
  }
  .nav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 12px;
    padding: 7px 4px 5px;
    font-size: 11px;
    text-decoration: none;
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .nav-link .nav-icon { font-size: 20px; line-height: 1; }
  .nav-link:active { transform: scale(0.92); }
  .nav-link.active { color: var(--accent); background: rgba(212,175,55,0.12); }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 10px;
  }
  #chassisInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 17px;
    padding: 10px 4px;
    text-align: center;
    letter-spacing: 0.5px;
    direction: ltr;
    min-width: 0;
  }
  #chassisInput::placeholder {
    color: var(--muted);
    font-size: 14px;
  }
  .icon-btn {
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .icon-btn:active { transform: scale(0.93); }
 
  .media-actions {
    display: flex;
    gap: 8px;
  }
  .media-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--accent-dim);
    background: var(--panel-2);
    color: var(--accent);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .media-btn:active { transform: scale(0.95); }
  .media-icon { font-size: 22px; line-height: 1; }
  .media-label { font-size: 11.5px; }
  .media-btn.busy { animation: pulse2 1.1s infinite; }
  @keyframes pulse2 {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(212,175,55,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
 
  #cropOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #cropOverlay.active { display: flex; }
  #cropCanvasWrap {
    position: relative;
    max-width: 100%;
    max-height: 65vh;
    touch-action: none;
  }
  #cropCanvas {
    max-width: 100%;
    max-height: 65vh;
    display: block;
    border-radius: 8px;
    touch-action: none;
  }
  .crop-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 12px 0 16px;
    line-height: 1.6;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .crop-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #cropConfirm { background: var(--accent); color: #1a1a1a; }
  #cropCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
  .status-line.ok-text { color: var(--good); }
  .results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .result-card.exact {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  .plate-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
    direction: rtl;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
  }
  .field-row:first-of-type { border-top: none; }
  .field-label { color: var(--muted); }
  .field-value { color: var(--text); font-weight: 600; text-align: left; direction: ltr; unicode-bidi: plaintext; }
  .empty-state, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }
  .no-results { color: var(--danger); }
  .count-badge {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  const dbCountEl = document.getElementById('dbCount');
  const input = document.getElementById('chassisInput');
  const clearBtn = document.getElementById('clearBtn');
  const statusLine = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');
 
  window.addEventListener('error', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });
 
  let rawRecords = [];
  try {
    rawRecords = await ensureBaseRecordsSeeded();
    dbCountEl.textContent = '';
  } catch (err) {
    dbCountEl.textContent = '⚠️ تعذر تحميل قاعدة البيانات (' + err.message + ')';
    try {
      rawRecords = await getAllRecords();
    } catch (e) {
      rawRecords = [];
    }
  }
 
  const normDB = rawRecords.map(r => ({
    plate: r.plate || '', type: r.type || '', bank: r.bank || '',
    chassis: r.chassis || '', normChassis: normalizeText(r.chassis || '')
  })).filter(r => r.normChassis);
 
  // No generic "database: N records" line is shown — dbCountEl is reserved
  // for loading/error states only (see the try/catch above).
  dbCountEl.textContent = '';
 
  function fieldRow(label, value) {
    return '<div class="field-row"><span class="field-label">' + label + '</span><span class="field-value">' + escapeHtml(String(value)) + '</span></div>';
  }
 
  function renderEmpty() {
    resultsEl.innerHTML = '<div class="empty-state">اكتب رقم الهيكل (الشاصي) كامل أو جزء منه</div>';
  }
 
  function renderResults(query) {
    const token = normalizeText(query);
    if (!token) { renderEmpty(); return false; }

    const exact = [];
    for (const row of normDB) {
      if (row.normChassis === token) exact.push(row);
    }

    const seen = new Set();
    const list = exact.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (list.length === 0) {
      resultsEl.innerHTML = '<div class="no-results">⚠️ مفيش تطابق تام لـ «' + escapeHtml(query) + '»<br>التطابق لازم يكون تام — مش أقرب نتيجة</div>';
      return false;
    }

    let html = '<div class="count-badge">✅ تطابق تام — ' + list.length + ' نتيجة</div>';
    for (const r of list) {
      html += '<div class="result-card exact">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;

    vibrateFound(5000);
    for (const r of list) {
      addHistoryEntry({
        plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis,
        matchedBy: 'chassis', searchedAt: new Date().toISOString()
      }).catch(() => {});
    }
    return true;
  }
 
  let debounceTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = input.value;
    if (!val.trim()) { renderEmpty(); return; }
    debounceTimer = setTimeout(() => renderResults(val), 150);
  });
 
  clearBtn.addEventListener('click', () => {
    input.value = '';
    renderEmpty();
    statusLine.textContent = '';
    statusLine.className = 'status-line';
    input.focus();
  });
 
  // ---- Image (OCR) search for chassis numbers — Latin letters + digits only,
  // since VIN/chassis numbers on Saudi registration docs are written in Latin
  // (e.g. JTNA14CK9S3024218), unlike plate numbers which use Arabic letters. ----
  const camBtn = document.getElementById('camBtn');
  const camInput = document.getElementById('camInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadInput = document.getElementById('uploadInput');
  const cropOverlay = document.getElementById('cropOverlay');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropConfirm = document.getElementById('cropConfirm');
  const cropCancel = document.getElementById('cropCancel');
  let ocrWorker = null;
  let cropState = null;
 
  camBtn.addEventListener('click', () => camInput.click());
  uploadBtn.addEventListener('click', () => uploadInput.click());
 
  function openCropper(file, triggerBtn) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        cropCanvas.width = img.naturalWidth;
        cropCanvas.height = img.naturalHeight;
        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        cropState = { img, ctx, sel: null, dragging: false, startX: 0, startY: 0, triggerBtn };
        cropOverlay.classList.add('active');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
 
  function getCanvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
 
  function redrawWithSelection() {
    if (!cropState) return;
    const { ctx, img, sel } = cropState;
    ctx.drawImage(img, 0, 0, cropCanvas.width, cropCanvas.height);
    if (sel) {
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = Math.max(3, cropCanvas.width * 0.005);
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.fillStyle = 'rgba(212,175,55,0.18)';
      ctx.fillRect(sel.x, sel.y, sel.w, sel.h);
    }
  }
 
  cropCanvas.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const p = getCanvasPos(e);
    cropState.dragging = true;
    cropState.startX = p.x;
    cropState.startY = p.y;
    cropState.sel = { x: p.x, y: p.y, w: 0, h: 0 };
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (!cropState || !cropState.dragging) return;
    const p = getCanvasPos(e);
    const x = Math.min(p.x, cropState.startX);
    const y = Math.min(p.y, cropState.startY);
    const w = Math.abs(p.x - cropState.startX);
    const h = Math.abs(p.y - cropState.startY);
    cropState.sel = { x, y, w, h };
    redrawWithSelection();
  });
  cropCanvas.addEventListener('pointerup', () => { if (cropState) cropState.dragging = false; });
  cropCanvas.addEventListener('pointercancel', () => { if (cropState) cropState.dragging = false; });
 
  cropCancel.addEventListener('click', () => {
    cropOverlay.classList.remove('active');
    cropState = null;
  });
 
  cropConfirm.addEventListener('click', () => {
    if (!cropState) return;
    const { sel, triggerBtn } = cropState;
    cropOverlay.classList.remove('active');
 
    const cropped = document.createElement('canvas');
    if (sel && sel.w > 15 && sel.h > 10) {
      cropped.width = sel.w;
      cropped.height = sel.h;
      cropped.getContext('2d').drawImage(cropCanvas, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
    } else {
      cropped.width = cropCanvas.width;
      cropped.height = cropCanvas.height;
      cropped.getContext('2d').drawImage(cropCanvas, 0, 0);
    }
    const out = preprocessForOCR(cropped);
    out.toBlob((blob) => { runOCR(blob, triggerBtn); }, 'image/png');
    cropState = null;
  });
 
  // Upscale small crops + binarize to black/white for much better OCR accuracy
  // on small, low-contrast photos straight from a phone camera.
  // Otsu's method: picks the brightness threshold that best separates a
  // bimodal histogram (dark text vs. bright background) instead of a plain
  // mean, which holds up much better under glare, shadows or dim lighting.
  function computeOtsuThreshold(gray, n) {
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      let v = gray[i] | 0;
      if (v < 0) v = 0; else if (v > 255) v = 255;
      hist[v]++;
    }
    let sumAll = 0;
    for (let t = 0; t < 256; t++) sumAll += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = n - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sumAll - sumB) / wF;
      const diff = mB - mF;
      const varBetween = wB * wF * diff * diff;
      if (varBetween > maxVar) { maxVar = varBetween; threshold = t; }
    }
    return threshold;
  }

  function preprocessForOCR(sourceCanvas) {
    const MIN_DIM = 640;
    let scale = 1;
    const shortSide = Math.min(sourceCanvas.width, sourceCanvas.height);
    if (shortSide > 0 && shortSide < MIN_DIM) {
      scale = Math.min(5, MIN_DIM / shortSide);
    }
    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    out.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceCanvas, 0, 0, out.width, out.height);
 
    const imgData = ctx.getImageData(0, 0, out.width, out.height);
    const d = imgData.data;
    const n = d.length / 4;
    const gray = new Float32Array(n);
    let minG = 255, maxG = 0;
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      gray[j] = g;
      if (g < minG) minG = g;
      if (g > maxG) maxG = g;
    }
    // Contrast stretch before thresholding — see index.html for details.
    const range = Math.max(1, maxG - minG);
    for (let j = 0; j < n; j++) {
      gray[j] = ((gray[j] - minG) / range) * 255;
    }
    const threshold = computeOtsuThreshold(gray, n);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const v = gray[j] > threshold ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return out;
  }
 
  async function runOCR(file, triggerBtn) {
    if (!file) return;
 
    triggerBtn.classList.add('busy');
    statusLine.textContent = '📷 جارٍ قراءة الصورة...';
    statusLine.className = 'status-line';
    resultsEl.innerHTML = '';
 
    try {
      if (typeof Tesseract === 'undefined') {
        throw new Error('مكتبة القراءة لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }
      if (!ocrWorker) {
        statusLine.textContent = '📷 جارٍ تجهيز محرك القراءة (أول مرة فقط)...';
        ocrWorker = await Tesseract.createWorker('eng');
        // Chassis/VIN numbers are Latin letters + digits only.
        await ocrWorker.setParameters({
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz',
          tessedit_pageseg_mode: '7' // treat crop as a single text line (typical for a tight VIN crop)
        });
      }
 
      statusLine.textContent = '📷 جارٍ تحليل الصورة...';
      const { data } = await ocrWorker.recognize(file);
      const text = (data && data.text) ? data.text.trim() : '';
 
      if (!text) {
        statusLine.textContent = '⚠️ مقدرتش أقرا أي نص من الصورة — جرب تحديد مساحة رقم الهيكل بدقة أكتر';
        statusLine.className = 'status-line';
        renderEmpty();
        return;
      }
 
      input.value = text;
      statusLine.textContent = '✅ قريت: ' + text.replace(/\s+/g, ' ');
      statusLine.className = 'status-line ok-text';
      renderResults(text);
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الصورة: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      triggerBtn.classList.remove('busy');
    }
  }
 
  camInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, camBtn);
    camInput.value = '';
  });
 
  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, uploadBtn);
    uploadInput.value = '';
  });
 
  renderEmpty();
})();
</script>
