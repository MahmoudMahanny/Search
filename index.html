<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لمّاح">
<meta name="theme-color" content="#071a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2b1c'/%3E%3Cpath d='M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z' fill='%23d4af37'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%230e2b1c'/%3E%3C/svg%3E">
<title>لمّاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071a12;
    --panel: #0e2b1c;
    --panel-2: #123423;
    --border: #1f4a34;
    --text: #eef4f0;
    --muted: #8fae9c;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .brand-logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  header h1 {
    font-family: 'Almarai', 'Tajawal', 'Segoe UI', sans-serif;
    font-size: 34px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent);
    line-height: 1;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    min-height: 16px;
  }
  header p:empty { display: none; }
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(14, 43, 28, 0.92);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-top: 1px solid var(--border);
    max-width: 560px;
    margin: 0 auto;
  }
  .nav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 12px;
    padding: 7px 4px 5px;
    font-size: 11px;
    text-decoration: none;
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .nav-link .nav-icon { font-size: 20px; line-height: 1; }
  .nav-link:active { transform: scale(0.92); }
  .nav-link.active { color: var(--accent); background: rgba(212,175,55,0.12); }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* ---- Plate-styled search field: mimics a real Saudi license plate
     (white body, bold black digits/letters, green KSA strip + emblem,
     small Latin transliteration line) instead of a plain text input. ---- */
  .plate-frame {
    display: flex;
    align-items: stretch;
    background: linear-gradient(180deg, #ffffff, #f2f2f0);
    border: 3px solid #14140f;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .plate-emblem {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: linear-gradient(180deg, #0f7a3c, #0a4f27);
    border-left: 2px solid #14140f;
    padding: 6px 0;
  }
  .plate-emblem .ksa-star { font-size: 13px; line-height: 1; color: #fff7e0; }
  .plate-emblem .ksa-text {
    writing-mode: vertical-rl;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
  }
  .plate-clear {
    background: transparent;
    color: #14140f;
    width: 34px;
  }
  .plate-clear:active { background: rgba(0,0,0,0.06); }
  .plate-input-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    padding: 4px 2px;
  }
  .plate-input-row {
    display: flex;
    flex-direction: row;
    direction: rtl;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
  }
  .plate-field-sep {
    width: 2px;
    height: 28px;
    background: #14140f;
    opacity: 0.18;
    flex-shrink: 0;
    border-radius: 1px;
  }
  #plateLetters, #plateDigits {
    background: transparent;
    border: none;
    outline: none;
    color: #14140f;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight: 800;
    font-size: 26px;
    padding: 6px 2px 0;
    text-align: center;
    letter-spacing: 3px;
    min-width: 0;
  }
  #plateLetters {
    flex: 1.1;
    direction: rtl;
    max-width: 5.5em;
  }
  #plateDigits {
    flex: 1;
    direction: ltr;
    unicode-bidi: isolate;
    max-width: 6em;
    font-variant-numeric: tabular-nums;
    letter-spacing: 5px;
  }
  #plateLetters::placeholder, #plateDigits::placeholder {
    color: #8a8a80;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: normal;
  }
  .plate-latin {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    color: #4a4a42;
    min-height: 14px;
    direction: ltr;
  }
  .plate-hint {
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
    padding: 0 4px;
  }
  .icon-btn {
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.93); }

  .media-actions {
    display: flex;
    gap: 8px;
  }
  .media-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .media-btn:active { transform: scale(0.95); }
  .media-icon { font-size: 22px; line-height: 1; }
  .media-label { font-size: 11.5px; }
  .media-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1a1a;
  }
  .media-btn-primary .media-label { color: #1a1a1a; }
  .media-btn-primary.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.1s infinite;
  }
  .media-btn-primary.listening .media-label { color: #fff; }
  #camBtn {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
  .media-btn.busy {
    animation: pulse2 1.1s infinite;
  }
  @keyframes pulse2 {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(212,175,55,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .preview-img {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 4px;
  }
  #cropOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #cropOverlay.active { display: flex; }
  #cropCanvasWrap {
    position: relative;
    max-width: 100%;
    max-height: 65vh;
    touch-action: none;
  }
  #cropCanvas {
    max-width: 100%;
    max-height: 65vh;
    display: block;
    border-radius: 8px;
    touch-action: none;
  }
  .crop-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 12px 0 16px;
    line-height: 1.6;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .crop-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #cropConfirm { background: var(--accent); color: #1a1a1a; }
  #cropCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  .secondary-actions {
    display: flex;
    gap: 8px;
  }
  .secondary-btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .secondary-btn:active { transform: scale(0.96); }
  .secondary-btn.busy { opacity: 0.6; animation: pulse2 1.1s infinite; }
  .danger-btn { color: var(--danger); border-color: rgba(224,90,90,0.35); }
  .extra-count-badge {
    text-align: center;
    font-size: 11.5px;
    color: var(--good);
  }

  #confirmOverlay, #matchOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirmOverlay.active, #matchOverlay.active { display: flex; }
  #confirmBox, #matchBox {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 18px;
    max-width: 360px;
    width: 100%;
  }
  #matchBox {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-dim);
    animation: matchPulse 0.9s ease-in-out infinite;
  }
  @keyframes matchPulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--accent-dim); }
    50% { box-shadow: 0 0 0 8px rgba(212,175,55,0.18); }
  }
  #matchTitle {
    text-align: center;
    color: var(--good);
    font-weight: 800;
    font-size: 16px;
    margin-bottom: 10px;
  }
  #matchPlate {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 12px;
    direction: rtl;
  }
  #matchDetails { margin-bottom: 16px; }
  #matchClose {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: var(--accent);
    color: #14140f;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
  #confirmMessage {
    text-align: center;
    font-size: 15px;
    margin-bottom: 18px;
    line-height: 1.7;
  }
  #confirmOk { background: var(--danger); color: #fff; }
  #confirmCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  #clearBtn.plate-clear {
    background: transparent;
    border: none;
    color: #14140f;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224,90,90,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(224,90,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,90,90,0); }
  }
  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
  .status-line.listening-text { color: var(--danger); }
  .status-line.ok-text { color: var(--good); }

  .quickpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .quickpad button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 0;
    font-size: 15px;
    cursor: pointer;
  }
  .quickpad button:active { background: var(--accent-dim); }

  .results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    animation: fadeIn 0.25s ease;
  }
  .result-card.exact {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .plate-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
    direction: rtl;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
  }
  .field-row:first-of-type { border-top: none; }
  .field-label { color: var(--muted); }
  .field-value { color: var(--text); font-weight: 600; text-align: left; direction: ltr; unicode-bidi: plaintext;}

  .empty-state, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }
  .no-results { color: var(--danger); }

  .count-badge {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 24px;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="lammahGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f3d47c"/>
            <stop offset="1" stop-color="#b8892a"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lammahGrad)"/>
        <path d="M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z" fill="#0e2b1c"/>
        <circle cx="32" cy="34" r="7.5" fill="url(#lammahGrad)"/>
        <circle cx="32" cy="34" r="3" fill="#0e2b1c"/>
        <path d="M47 12l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2 2.2-5Z" fill="#fff7e0"/>
      </svg>
      <h1>لمّاح</h1>
    </div>
    <p id="dbCount">جارٍ تحميل قاعدة البيانات...</p>
  </header>

  <div class="secondary-actions">
    <button id="excelBtn" class="secondary-btn">📊 إضافة بيانات من إكسيل</button>
    <button id="clearDataBtn" class="secondary-btn danger-btn">🗑️ مسح كل البيانات</button>
    <input id="excelInput" type="file" accept=".xlsx,.xls" style="display:none" />
  </div>
  <div id="extraCountBadge" class="extra-count-badge" style="display:none"></div>

  <div class="search-box">
    <div class="plate-frame">
      <div class="plate-emblem" aria-hidden="true">
        <span class="ksa-star">★</span>
        <span class="ksa-text">KSA</span>
      </div>
      <button id="clearBtn" class="icon-btn plate-clear" title="مسح">✕</button>
      <div class="plate-input-col">
        <div class="plate-input-row">
          <input id="plateLetters" type="text" maxlength="3" placeholder="عبق" autocomplete="off" aria-label="حروف اللوحة" />
          <span class="plate-field-sep" aria-hidden="true"></span>
          <input id="plateDigits" type="text" maxlength="4" inputmode="numeric" placeholder="3847" autocomplete="off" aria-label="أرقام اللوحة" />
        </div>
        <div id="plateLatin" class="plate-latin"></div>
      </div>
    </div>
    <div class="plate-hint">٣ حروف عربية + ٤ أرقام — فعّل المايك وقول اللوحة</div>

    <div class="media-actions">
      <button id="camBtn" class="media-btn" title="التقاط صورة">
        <span class="media-icon">📷</span><span class="media-label">كاميرا</span>
      </button>
      <button id="uploadBtn" class="media-btn" title="رفع صورة">
        <span class="media-icon">🖼️</span><span class="media-label">صورة</span>
      </button>
      <button id="micBtn" class="media-btn media-btn-primary" title="استماع مستمر">
        <span class="media-icon">🎤</span><span class="media-label" id="micLabel">مايك</span>
      </button>
      <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none" />
      <input id="uploadInput" type="file" accept="image/*" style="display:none" />
    </div>

    <div id="statusLine" class="status-line"></div>
  </div>

  <div id="results" class="results"></div>

  <div id="cropOverlay">
    <div id="cropCanvasWrap">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="crop-hint">حدد بإصبعك مكان اللوحة بالظبط، وكل ما كانت المساحة أصغر وأدق كل ما كانت القراءة أفضل</div>
    <div class="crop-actions">
      <button id="cropCancel">إلغاء</button>
      <button id="cropConfirm">قص وابحث ✅</button>
    </div>
  </div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <div id="confirmMessage">هل تريد مسح كل البيانات المضافة؟</div>
      <div class="crop-actions">
        <button id="confirmCancel">إلغاء</button>
        <button id="confirmOk">نعم، امسح ✅</button>
      </div>
    </div>
  </div>

  <div id="matchOverlay" role="dialog" aria-modal="true" aria-labelledby="matchTitle">
    <div id="matchBox">
      <div id="matchTitle">✅ تم العثور على اللوحة</div>
      <div id="matchPlate"></div>
      <div id="matchDetails"></div>
      <button type="button" id="matchClose">إغلاق</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-link active"><span class="nav-icon">🔍</span>بحث باللوحة</a>
  <a href="chassis.html" class="nav-link"><span class="nav-icon">🔧</span>بحث بالهيكل</a>
  <a href="history.html" class="nav-link"><span class="nav-icon">📋</span>السجل</a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  const dbCountEl = document.getElementById('dbCount');
  dbCountEl.textContent = 'جارٍ تحميل قاعدة البيانات...';

  // Global safety net: if ANYTHING below throws unexpectedly and isn't
  // caught locally, show it here instead of leaving the "loading" message
  // stuck forever with no way to diagnose what happened.
  window.addEventListener('error', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  // ---- Load records: from IndexedDB if already seeded on this device,
  // otherwise fetch+decompress the base file once and seed IndexedDB with it.
  // Once "seeded" is set (even after a full clear, which keeps it true with
  // zero rows), the base file is never re-fetched — a refresh after clearing
  // everything will correctly show an empty database, not silently restore it.
  let rawRecords;
  try {
    const alreadySeeded = await getMeta('seeded');
    if (alreadySeeded) {
      rawRecords = await getAllRecords();
    } else {
      const resp = await fetch('plates.txt.gz');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      const bytes = new Uint8Array(buf);
      // Check gzip magic number (0x1f 0x8b). Some CDNs (incl. GitHub Pages/Fastly)
      // transparently decompress .gz files server-side via Content-Encoding, in
      // which case buf already holds the plain text and re-decompressing would
      // fail. Detect which case we're in instead of assuming.
      const isGzipped = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      let text;
      if (isGzipped) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('المتصفح لا يدعم فك الضغط — استخدم كروم حديث');
        }
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([buf]).stream().pipeThrough(ds);
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder('utf-8').decode(bytes);
      }
      const lines = text.split('\n').filter(Boolean);
      const seeded = lines.map(line => {
        const parts = line.split('|');
        const plate = parts[0] || '', type = parts[1] || '', bank = parts[2] || '', chassis = parts[3] || '';
        const normPlate = normalizeText(plate);
        return {
          dedupeKey: normPlate + '|' + normalizeText(chassis) + '|' + normalizeText(bank),
          plate, type, bank, chassis, normPlate, source: 'base'
        };
      });
      await putRecords(seeded);
      await setMeta('seeded', true);
      rawRecords = seeded;
    }
  } catch (err) {
    dbCountEl.textContent = '⚠️ تعذر تحميل قاعدة البيانات (' + err.message + ')';
    return;
  }

  const lettersInput = document.getElementById('plateLetters');
  const digitsInput = document.getElementById('plateDigits');
  const plateLatinEl = document.getElementById('plateLatin');
  const micBtn = document.getElementById('micBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusLine = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');

  // Official Arabic->Latin letter mapping used on real Saudi plates (not a
  // simple phonetic transliteration — e.g. Mim -> Z, Ain -> E, Ha -> J).
  const plateLatinMap = {
    'ا': 'A', 'ب': 'B', 'ح': 'J', 'د': 'D', 'ر': 'R', 'س': 'S', 'ص': 'X',
    'ط': 'T', 'ع': 'E', 'ق': 'G', 'ك': 'K', 'ل': 'L', 'م': 'Z', 'ن': 'N',
    'ه': 'H', 'و': 'U', 'ي': 'V', 'ى': 'V'
  };

  function stripBidiMarks(str) {
    return String(str || '').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '');
  }

  function getPlateCombinedRaw() {
    const letters = stripBidiMarks(normalizeArabicLetters(lettersInput.value)).toLowerCase().replace(/[^\u0621-\u064A]/g, '');
    const digits = stripBidiMarks(normalizeDigits(digitsInput.value)).replace(/\D/g, '');
    const query = [letters, digits].filter(Boolean).join(' ');
    return { letters, digits, query, token: letters + digits };
  }

  function setPlateFields(parsed) {
    lettersInput.value = parsed.letters || '';
    digitsInput.value = parsed.digits || '';
    updatePlateLatin();
  }

  function clearPlateFields() {
    lettersInput.value = '';
    digitsInput.value = '';
    updatePlateLatin();
  }

  function getPlateStatusLabel() {
    const { letters, digits } = getPlateCombinedRaw();
    if (!letters && !digits) return '';
    if (digits) return letters + ' \u2066' + digits + '\u2069';
    return letters;
  }

  // Mirrors the small Latin/Western line printed under the Arabic on a real
  // plate, so the field genuinely looks/behaves like one as you type.
  function updatePlateLatin() {
    if (!plateLatinEl) return;
    const { letters, digits } = getPlateCombinedRaw();
    const lettersLatin = letters.split('').map(ch => plateLatinMap[ch] || '').filter(Boolean).join(' ');
    plateLatinEl.textContent = lettersLatin
      ? (lettersLatin + (digits ? '   ' + digits : ''))
      : digits;
  }

  // Normalization helpers (normalizeText, normalizeDigits, normalizeArabicLetters,
  // escapeHtml, vibrateFound) are provided globally by db.js, loaded above.

  // ---- Saudi plate speech parsing (voice + typed) ----
  const LETTER_DEFINITIONS = [
    ['ا', ['الف', 'ألف', 'اليف', 'ا', 'alif', 'alef', 'alf']],
    ['ب', ['باء', 'با', 'به', 'ب', 'ba', 'baa', 'be', 'bee']],
    ['ت', ['تاء', 'تا', 'ته', 'ت', 'ta', 'taa', 'te']],
    ['ث', ['ثاء', 'ثا', 'ثه', 'ث', 'tha', 'thaa']],
    ['ج', ['جيم', 'جا', 'جه', 'ج', 'jeem', 'jim', 'ga']],
    ['ح', ['حاء', 'حا', 'حه', 'ح', 'ha', 'haa', '7a']],
    ['خ', ['خاء', 'خا', 'خه', 'خ', 'kha', 'khaa', '5a']],
    ['د', ['دال', 'دا', 'ده', 'د', 'da', 'dal']],
    ['ذ', ['ذال', 'ذا', 'ذه', 'ذ', 'dha', 'thal']],
    ['ر', ['راء', 'را', 'ره', 'ر', 'ra', 'raa', 're']],
    ['ز', ['زاي', 'زين', 'زا', 'زه', 'ز', 'za', 'zay', 'zain']],
    ['س', ['سين', 'سا', 'سه', 'س', 'seen', 'sin', 'sa']],
    ['ش', ['شين', 'شا', 'شه', 'ش', 'sheen', 'shin', 'sha']],
    ['ص', ['صاد', 'صا', 'صه', 'ص', 'saad', 'sad', 'sod']],
    ['ض', ['ضاد', 'ضا', 'ضه', 'ض', 'daad', 'dad', 'dod']],
    ['ط', ['طاء', 'طا', 'طه', 'ط', 'taa', 'tah', '6a']],
    ['ظ', ['ظاء', 'ظا', 'ظه', 'ظ', 'zaa', 'zah']],
    ['ع', ['عين', 'عا', 'عه', 'ع', 'ain', 'ayn', 'ein']],
    ['غ', ['غين', 'غا', 'غه', 'غ', 'ghain', 'ghayn', 'ghein']],
    ['ف', ['فاء', 'فا', 'فه', 'ف', 'fa', 'faa', 'fe']],
    ['ق', ['قاف', 'قا', 'قه', 'ق', 'qaf', 'qaaf', 'gaf', 'gaaf']],
    ['ك', ['كاف', 'كا', 'كه', 'ك', 'kaf', 'kaaf', 'ka']],
    ['ل', ['لام', 'لا', 'له', 'ل', 'lam', 'la', 'le']],
    ['م', ['ميم', 'ما', 'مه', 'م', 'meem', 'miim', 'mem', 'ma']],
    ['ن', ['نون', 'نا', 'نه', 'ن', 'noon', 'nun', 'na']],
    ['ه', ['هاء', 'ها', 'ه', 'ha', 'haa', 'he']],
    ['و', ['واو', 'وا', 'وه', 'و', 'waw', 'wa', 'wow']],
    ['ي', ['ياء', 'يا', 'يه', 'ي', 'ى', 'ya', 'yaa', 'yea']]
  ];

  const letterNames = (function buildLetterNamesMap() {
    const map = {};
    for (const [letter, names] of LETTER_DEFINITIONS) {
      for (const raw of names) {
        const key = normalizeArabicLetters(stripTashkeel(raw)).toLowerCase();
        if (key) map[key] = letter;
      }
    }
    return map;
  })();

  const SPEECH_FILLER = new Set([
    'اه', 'آه', 'ايه', 'إيه', 'ايوه', 'ايوة', 'يعني', 'تمام', 'طيب', 'كده', 'كدا',
    'لو', 'سوا', 'ال', 'و', 'او', 'أو', 'يا', 'في', 'على', 'من', 'الى', 'إلى',
    'رقم', 'لوحة', 'اللوحة', 'حروف', 'ارقام', 'أرقام', 'ارقم', 'بعدين', 'قول', 'قولي',
    'please', 'ok', 'okay', 'the', 'plate', 'letter', 'letters', 'number', 'numbers',
    'saudi', 'ksa', 'سيارة', 'سياره', 'السيارة', 'السياره'
  ]);

  const numberWords = {
    'صفر': '0', 'صفره': '0', 'زيرو': '0', 'zero': '0',
    'واحد': '1', 'وحدة': '1', 'واحده': '1', 'وحده': '1', 'one': '1',
    'اثنين': '2', 'اتنين': '2', 'إثنين': '2', 'اثنان': '2', 'ثنين': '2', 'two': '2',
    'ثلاثة': '3', 'ثلاث': '3', 'تلاته': '3', 'ثلاثه': '3', 'تلاتة': '3', 'تلات': '3', 'three': '3',
    'اربعة': '4', 'اربع': '4', 'أربعة': '4', 'أربع': '4', 'اربعه': '4', 'أربعه': '4', 'four': '4',
    'خمسة': '5', 'خمس': '5', 'خمسه': '5', 'five': '5',
    'ستة': '6', 'ست': '6', 'سته': '6', 'six': '6',
    'سبعة': '7', 'سبع': '7', 'سبعه': '7', 'seven': '7',
    'ثمانية': '8', 'ثمان': '8', 'ثمانيه': '8', 'تمانية': '8', 'تمانيه': '8', 'تمان': '8', 'eight': '8',
    'تسعة': '9', 'تسع': '9', 'تسعه': '9', 'nine': '9'
  };

  function resolveSpokenDigit(word) {
    const wNorm = normalizeArabicLetters(stripTashkeel(word)).toLowerCase();
    if (!wNorm) return null;
    if (/^\d$/.test(wNorm)) return wNorm;
    if (numberWords[wNorm] !== undefined) return numberWords[wNorm];
    return null;
  }

  function isSpeechFiller(word) {
    if (!word) return true;
    return SPEECH_FILLER.has(normalizeArabicLetters(stripTashkeel(word)).toLowerCase());
  }

  function resolveSpokenLetter(word) {
    if (!word || isSpeechFiller(word)) return null;
    let w = normalizeArabicLetters(stripTashkeel(word)).toLowerCase();
    if (!w) return null;

    if (letterNames[w]) return letterNames[w];
    if (w.length === 1 && /[\u0621-\u064A]/.test(w)) return w;

    if (w.startsWith('ال') && w.length > 2) {
      const stripped = w.slice(2);
      if (letterNames[stripped]) return letterNames[stripped];
      if (stripped.length === 1 && /[\u0621-\u064A]/.test(stripped)) return stripped;
      w = stripped;
    }

    if (w.length === 2 && w[1] === 'ه' && /[\u0621-\u064A]/.test(w[0])) {
      if (letterNames[w]) return letterNames[w];
      return w[0];
    }

    return null;
  }

  function formatPlateSpeechDisplay(parsed) {
    if (!parsed.letters && !parsed.digits) return '';
    if (parsed.digits) return parsed.letters + ' ' + parsed.digits;
    return parsed.letters;
  }

  // STT often emits full name + colloquial for the same letter ("طاء" then "طه")
  // but intentional doubles ("به" twice -> "بب") must be kept.
  function appendSpokenLetterName(letters, word, resolved, prevWord) {
    if (!resolved || letters.length >= 3) return letters;
    const wNorm = normalizeArabicLetters(stripTashkeel(word)).toLowerCase();
    const prevNorm = prevWord ? normalizeArabicLetters(stripTashkeel(prevWord)).toLowerCase() : '';
    if (letters.length && letters[letters.length - 1] === resolved) {
      const isShortColloquial = wNorm.length === 2 && wNorm[1] === 'ه';
      const prevWasLongName = prevNorm.length >= 3 && letterNames[prevNorm] === resolved;
      if (isShortColloquial && prevWasLongName) return letters;
    }
    return letters + resolved;
  }

  function parseSaudiPlateSpeech(text) {
    text = stripBidiMarks(normalizeDigits(text));
    text = stripTashkeel(text);
    const words = text.trim().split(/\s+/).filter(Boolean);
    let letters = '';
    let digits = '';
    let digitsPhase = false;
    let prevLetterWord = '';

    for (let w of words) {
      const wNorm = normalizeArabicLetters(w.trim()).toLowerCase();
      if (!wNorm || isSpeechFiller(wNorm)) continue;

      if (letters.length >= 3) digitsPhase = true;

      const glued = wNorm.match(/^([\u0621-\u064A]+)(\d+)$/);
      if (glued) {
        if (letters.length < 3) letters += glued[1].slice(0, 3 - letters.length);
        digitsPhase = true;
        digits += glued[2].slice(0, 4 - digits.length);
        continue;
      }

      if (/^\d+$/.test(wNorm)) {
        digitsPhase = true;
        digits += wNorm.slice(0, 4 - digits.length);
        continue;
      }

      if (digitsPhase || letters.length >= 3) {
        const asDigit = resolveSpokenDigit(wNorm);
        if (asDigit !== null && digits.length < 4) {
          digits += asDigit;
          continue;
        }
      }

      if (!digitsPhase && letters.length < 3) {
        const asLetter = resolveSpokenLetter(wNorm);
        if (asLetter) {
          letters = appendSpokenLetterName(letters, wNorm, asLetter, prevLetterWord);
          prevLetterWord = wNorm;
          if (letters.length >= 3) digitsPhase = true;
          continue;
        }
        if (/^[\u0621-\u064A]+$/.test(wNorm)) {
          letters += wNorm.slice(0, 3 - letters.length);
          if (letters.length >= 3) digitsPhase = true;
          continue;
        }
      }

      if (numberWords[wNorm] !== undefined) {
        digitsPhase = true;
        if (digits.length < 4) digits += numberWords[wNorm];
        continue;
      }

      for (const ch of wNorm) {
        if (/\d/.test(ch)) {
          digitsPhase = true;
          if (digits.length < 4) digits += ch;
        } else if (!digitsPhase && /[\u0621-\u064A]/.test(ch) && letters.length < 3) {
          letters += ch;
        }
      }
      if (letters.length >= 3) digitsPhase = true;
    }

    letters = normalizeArabicLetters(letters).toLowerCase().slice(0, 3);
    digits = digits.slice(0, 4);
    return { letters, digits, token: letters + digits };
  }

  function transcriptToPlateToken(text) {
    return parseSaudiPlateSpeech(text).token;
  }

  function scorePlateCandidate(parsed) {
    let score = 0;
    if (parsed.letters.length === 3) score += 20;
    else score += parsed.letters.length * 4;
    if (parsed.digits.length === 4) score += 20;
    else score += parsed.digits.length * 4;
    // Only boost exact DB hits — never reward "close" letter/digit matches.
    if (parsed.token && parsed.letters.length === 3 && parsed.digits.length === 4 &&
        normDB.some(r => r.normPlate === parsed.token)) {
      score += 100;
    }
    return score;
  }

  // Exact DB hit only — do not snap to a nearby plate.
  function refinePlateWithDB(parsed) {
    return parsed || { letters: '', digits: '', token: '' };
  }

  function pickBestTranscript(candidates) {
    let bestText = '';
    let bestScore = -1;
    let bestParsed = { letters: '', digits: '', token: '' };
    for (const text of candidates) {
      if (!text || !String(text).trim()) continue;
      const parsed = parseSaudiPlateSpeech(text);
      const score = scorePlateCandidate(parsed);
      if (score > bestScore) {
        bestScore = score;
        bestText = text;
        bestParsed = parsed;
      }
    }
    return { text: bestText, parsed: bestParsed, score: bestScore };
  }

  // OCR often splits Arabic letters and digits across lines or adds noise —
  // try several extractions and keep the one that best forms a complete plate.
  function parseOCRPlateText(text) {
    const cleaned = stripBidiMarks(normalizeDigits(stripTashkeel(text || '')))
      .replace(/[A-Za-z]{2,}/g, ' ')
      .replace(/[^\u0621-\u064A0-9\s\n|]/g, ' ');

    let best = parseSaudiPlateSpeech(cleaned);
    let bestScore = scorePlateCandidate(best);

    const tryCandidate = (letters, digits) => {
      const normalizedLetters = normalizeArabicLetters(letters).toLowerCase().slice(0, 3);
      const normalizedDigits = String(digits).replace(/\D/g, '').slice(0, 4);
      if (normalizedLetters.length < 2 || normalizedDigits.length < 3) return;
      const candidate = {
        letters: normalizedLetters,
        digits: normalizedDigits,
        token: normalizedLetters + normalizedDigits
      };
      const score = scorePlateCandidate(candidate);
      if (score > bestScore) {
        best = candidate;
        bestScore = score;
      }
    };

    for (const glued of cleaned.match(/[\u0621-\u064A]{2,4}\d{3,4}|\d{3,4}[\u0621-\u064A]{2,4}/g) || []) {
      const p = parseSaudiPlateSpeech(glued);
      tryCandidate(p.letters, p.digits);
    }

    const letterRuns = cleaned.match(/[\u0621-\u064A]{2,4}/g) || [];
    const digitRuns = cleaned.match(/\d{3,4}/g) || [];
    for (const lr of letterRuns) {
      for (const dr of digitRuns) {
        tryCandidate(lr, dr);
      }
    }

    for (const line of cleaned.split(/\n+/)) {
      const lineParsed = parseSaudiPlateSpeech(line);
      const score = scorePlateCandidate(lineParsed);
      if (score > bestScore) {
        best = lineParsed;
        bestScore = score;
      }
    }

    return best;
  }

  // rawRecords already comes fully normalized (base + any extra records,
  // both stored together in IndexedDB) — no extra merge step needed.
  let normDB = rawRecords.map(r => ({
    plate: r.plate || '', type: r.type || '', bank: r.bank || '',
    chassis: r.chassis || '', normPlate: r.normPlate || normalizeText(r.plate || ''),
    source: r.source || 'base'
  }));

  const extraCountBadge = document.getElementById('extraCountBadge');

  function updateCountDisplay() {
    const extraCount = normDB.filter(r => r.source === 'extra').length;
    // No generic "database: N records" line is shown — keep the header
    // clean; dbCountEl is reserved for loading/error states only.
    dbCountEl.textContent = '';
    if (extraCount > 0) {
      extraCountBadge.style.display = 'block';
      extraCountBadge.textContent = '➕ ' + extraCount.toLocaleString('ar-EG') + ' سجل إضافي محفوظ على هذا الجهاز';
    } else {
      extraCountBadge.style.display = 'none';
    }
  }

  updateCountDisplay();

  // Pick the STT alternative most likely to be a valid Saudi plate.
  function scorePlateTranscript(text) {
    return scorePlateCandidate(parseSaudiPlateSpeech(text));
  }

  function renderEmpty() {
    resultsEl.innerHTML = '<div class="empty-state">اكتب أو قول ٣ حروف ثم ٤ أرقام — الأرقام من الشمال لليمين<br>مثال: «رمق» ثم «6543» أو «ستة خمسة أربعة ثلاثة»</div>';
  }

  const matchOverlay = document.getElementById('matchOverlay');
  const matchPlateEl = document.getElementById('matchPlate');
  const matchDetailsEl = document.getElementById('matchDetails');
  const matchCloseBtn = document.getElementById('matchClose');

  function closeMatchPopup() {
    matchOverlay.classList.remove('active');
    if (typeof stopAlarm === 'function') stopAlarm();
    if (typeof onMatchPopupClosed === 'function') onMatchPopupClosed();
  }

  function showMatchPopup(records) {
    if (!records || !records.length) return;
    const primary = records[0];
    matchPlateEl.textContent = primary.plate || '';
    let details = '';
    if (primary.type) details += fieldRow('النوع', primary.type);
    if (primary.bank) details += fieldRow('البنك', primary.bank);
    if (primary.chassis) details += fieldRow('الهيكل', primary.chassis);
    if (records.length > 1) {
      details += '<div class="field-row"><span class="field-label">سجلات</span><span class="field-value">' +
        records.length + ' تطابق تام</span></div>';
    }
    matchDetailsEl.innerHTML = details;
    matchOverlay.classList.add('active');
  }

  matchCloseBtn.addEventListener('click', closeMatchPopup);
  matchOverlay.addEventListener('click', (e) => {
    if (e.target === matchOverlay) closeMatchPopup();
  });

  function announceExactMatch(records) {
    vibrateFound(5000);
    showMatchPopup(records);
  }

  function renderResults(query) {
    const parsed = parseSaudiPlateSpeech(query);
    const token = parsed.token;
    setPlateFields(parsed);

    // Strict exact match only: full 3 letters + 4 digits, or nothing.
    if (parsed.letters.length !== 3 || parsed.digits.length !== 4 || !token) {
      if (!parsed.letters && !parsed.digits) {
        renderEmpty();
      } else {
        resultsEl.innerHTML = '<div class="empty-state">كمّل ٣ حروف و ٤ أرقام للبحث — التطابق لازم يكون تام</div>';
      }
      return false;
    }

    const exact = [];
    for (const row of normDB) {
      if (row.normPlate === token) exact.push(row);
    }

    const seen = new Set();
    const list = exact.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (list.length === 0) {
      const label = formatPlateSpeechDisplay(parsed) || query;
      resultsEl.innerHTML = '<div class="no-results">⚠️ مفيش لوحة مطابقة بالظبط لـ «' + escapeHtml(label) + '»<br>التطابق لازم يكون تام — مش أقرب نتيجة</div>';
      return false;
    }

    let html = '<div class="count-badge">✅ تطابق تام — ' + list.length + ' نتيجة</div>';
    for (const r of list) {
      html += '<div class="result-card exact">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;

    announceExactMatch(list);
    for (const r of list) {
      addHistoryEntry({
        plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis,
        matchedBy: 'plate', searchedAt: new Date().toISOString()
      }).catch(() => {});
    }
    return true;
  }

  function fieldRow(label, value) {
    return '<div class="field-row"><span class="field-label">' + label + '</span><span class="field-value">' + escapeHtml(String(value)) + '</span></div>';
  }

  // vibrateFound() / stopAlarm() and escapeHtml() are provided globally by db.js.

  let debounceTimer = null;
  function handlePlateFieldInput() {
    clearTimeout(debounceTimer);
    const rawCombined = (lettersInput.value + ' ' + digitsInput.value).trim();
    if (!rawCombined) {
      clearPlateFields();
      renderEmpty();
      return;
    }
    const parsed = parseSaudiPlateSpeech(rawCombined);
    setPlateFields(parsed);
    debounceTimer = setTimeout(() => renderResults(rawCombined), 150);
  }

  lettersInput.addEventListener('input', handlePlateFieldInput);
  digitsInput.addEventListener('input', handlePlateFieldInput);

  clearBtn.addEventListener('click', () => {
    clearPlateFields();
    closeMatchPopup();
    renderEmpty();
    statusLine.textContent = '';
    statusLine.className = 'status-line';
    lettersInput.focus();
  });

  let onMatchPopupClosed = null;

  // ---- Voice: on-device STT when ready (silent preload) + browser speech fallback ----
  const STT_MODEL_ID = 'Xenova/whisper-small';
  const STT_CHUNK_MS = 2800;
  const STT_MODULE_URL = 'https://esm.sh/@xenova/transformers@2.17.2';
  const LISTENING_MSG = '🎙️ المايك مفتوح — قول أي لوحة في أي وقت';
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const voiceSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  let sttPipeline = null;
  let sttLoadPromise = null;
  let sttEngineReady = false;
  let sttEngineDisabled = false;
  let recognition = null;
  let listening = false;
  let usingOnDeviceStt = false;
  let backgroundListening = false;
  let restartTimer = null;
  let idleResetTimer = null;
  let recordCycleTimer = null;
  let softRestarting = false;
  let finalTranscriptBuffer = '';
  let transcriptRolling = '';
  let lastSearchedToken = '';
  let pauseListeningForAlarm = false;
  let micStream = null;
  let mediaRecorder = null;
  let transcribeChain = Promise.resolve();
  let sttFailCount = 0;
  const micLabel = document.getElementById('micLabel');

  function setMicUi(active) {
    if (active) {
      micBtn.classList.add('listening');
      micLabel.textContent = 'مفتوح';
      micBtn.title = 'إيقاف الاستماع';
    } else {
      micBtn.classList.remove('listening');
      micLabel.textContent = 'مايك';
      micBtn.title = 'بدء الاستماع';
    }
  }

  function setListeningStatus(msg, kind) {
    statusLine.textContent = msg;
    statusLine.className = 'status-line' + (kind ? ' ' + kind : '');
  }

  function resetVoiceBuffer() {
    finalTranscriptBuffer = '';
    transcriptRolling = '';
    lastSearchedToken = '';
  }

  function handleVoicePlate(parsed, rawText) {
    if (parsed.letters.length !== 3 || parsed.digits.length !== 4) return false;
    if (parsed.token === lastSearchedToken) return false;
    lastSearchedToken = parsed.token;

    setPlateFields(parsed);
    const display = formatPlateSpeechDisplay(parsed);
    const found = renderResults(rawText || parsed.token);

    if (found) {
      setListeningStatus('✅ تم العثور على: ' + display, 'ok-text');
      pauseListeningForAlarm = true;
      stopCapture();
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        pauseListeningForAlarm = false;
        softRestarting = false;
        resetVoiceBuffer();
        clearPlateFields();
        if (backgroundListening) {
          setListeningStatus(LISTENING_MSG, 'listening-text');
          startCapture();
        }
      }, 5200);
    } else {
      clearPlateFields();
      resetVoiceBuffer();
    }
    return true;
  }

  function applyTranscript(text) {
    if (!text || !String(text).trim()) return;
    const chunk = String(text).trim();
    transcriptRolling = (transcriptRolling + ' ' + chunk).trim().slice(-600);
    finalTranscriptBuffer = transcriptRolling;
    const best = pickBestTranscript([transcriptRolling, chunk]);
    if (best.text) finalTranscriptBuffer = best.text;
    setPlateFields(best.parsed);
    clearTimeout(idleResetTimer);
    if (handleVoicePlate(best.parsed, best.text)) return;
    idleResetTimer = setTimeout(() => {
      if (pauseListeningForAlarm || !backgroundListening) return;
      const live = parseSaudiPlateSpeech(finalTranscriptBuffer);
      if (live.letters.length === 3 && live.digits.length === 4) {
        handleVoicePlate(live, finalTranscriptBuffer);
      } else {
        resetVoiceBuffer();
        clearPlateFields();
      }
    }, 1800);
  }

  function disableOnDeviceStt() {
    sttEngineDisabled = true;
    sttEngineReady = false;
    usingOnDeviceStt = false;
  }

  async function preloadSttEngine() {
    if (sttEngineDisabled || sttEngineReady || sttLoadPromise) return sttLoadPromise;
    sttLoadPromise = (async () => {
      try {
        const { pipeline, env } = await import(STT_MODULE_URL);
        if (env && env.backends && env.backends.onnx && env.backends.onnx.wasm) {
          env.backends.onnx.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.14.0/dist/';
        }
        if (env) {
          env.allowLocalModels = false;
          env.useBrowserCache = true;
        }
        sttPipeline = await pipeline('automatic-speech-recognition', STT_MODEL_ID);
        sttEngineReady = true;
        sttFailCount = 0;
      } catch (e) {
        disableOnDeviceStt();
      }
    })();
    return sttLoadPromise;
  }

  async function blobToMono16k(blob) {
    const arrayBuffer = await blob.arrayBuffer();
    const decodeCtx = new (window.AudioContext || window.webkitAudioContext)();
    let decoded;
    try {
      decoded = await decodeCtx.decodeAudioData(arrayBuffer.slice(0));
    } finally {
      try { await decodeCtx.close(); } catch (e) {}
    }
    const sampleRate = decoded.sampleRate;
    const length = decoded.length;
    const mono = new Float32Array(length);
    if (decoded.numberOfChannels === 1) {
      mono.set(decoded.getChannelData(0));
    } else {
      for (let c = 0; c < decoded.numberOfChannels; c++) {
        const ch = decoded.getChannelData(c);
        for (let i = 0; i < length; i++) mono[i] += ch[i] / decoded.numberOfChannels;
      }
    }
    if (sampleRate === 16000) return mono;
    const outLen = Math.max(1, Math.round(length * 16000 / sampleRate));
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const src = i * sampleRate / 16000;
      const idx = Math.min(length - 1, Math.floor(src));
      out[i] = mono[idx];
    }
    return out;
  }

  function pickRecorderMime() {
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
    for (const t of types) {
      if (MediaRecorder.isTypeSupported(t)) return t;
    }
    return '';
  }

  function clearRecordCycleTimer() {
    clearTimeout(recordCycleTimer);
    recordCycleTimer = null;
  }

  function stopCapture() {
    softRestarting = true;
    clearRecordCycleTimer();
    try {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    } catch (e) {}
    mediaRecorder = null;
    if (micStream) {
      try { micStream.getTracks().forEach(t => t.stop()); } catch (e) {}
      micStream = null;
    }
    listening = false;
    usingOnDeviceStt = false;
  }

  async function switchToWebSpeechSilently() {
    disableOnDeviceStt();
    stopCapture();
    softRestarting = false;
    if (!backgroundListening || pauseListeningForAlarm) return;
    try {
      if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    } catch (e) { return; }
    try { micStream.getTracks().forEach(t => t.stop()); micStream = null; } catch (e) {}
    startWebSpeechCapture();
  }

  async function processSttChunk(blob) {
    if (!backgroundListening || pauseListeningForAlarm || !blob || blob.size < 800) return;
    if (!sttEngineReady || !sttPipeline || sttEngineDisabled) return;
    try {
      const audio = await blobToMono16k(blob);
      if (!audio || audio.length < 1600) return;
      const result = await sttPipeline(audio, {
        language: 'arabic',
        task: 'transcribe',
        sampling_rate: 16000
      });
      const text = (result && result.text) ? result.text.trim() : '';
      if (text) applyTranscript(text);
      sttFailCount = 0;
    } catch (e) {
      sttFailCount++;
      if (sttFailCount >= 2 && backgroundListening) {
        await switchToWebSpeechSilently();
      }
    }
  }

  function queueSttChunk(blob) {
    transcribeChain = transcribeChain.then(() => processSttChunk(blob)).catch(() => {});
  }

  function beginRecordingCycle() {
    if (!backgroundListening || pauseListeningForAlarm || !micStream || !sttEngineReady || sttEngineDisabled) return;
    clearRecordCycleTimer();
    const mimeType = pickRecorderMime();
    const chunks = [];
    const rec = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);
    mediaRecorder = rec;
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      if (!backgroundListening || pauseListeningForAlarm || sttEngineDisabled) return;
      const blob = new Blob(chunks, { type: rec.mimeType || mimeType || 'audio/webm' });
      queueSttChunk(blob);
      beginRecordingCycle();
    };
    rec.onerror = () => { switchToWebSpeechSilently(); };
    try {
      rec.start();
      recordCycleTimer = setTimeout(() => {
        if (rec.state === 'recording') {
          try { rec.stop(); } catch (e) {}
        }
      }, STT_CHUNK_MS);
    } catch (e) {
      switchToWebSpeechSilently();
    }
  }

  async function startOnDeviceCapture() {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    usingOnDeviceStt = true;
    listening = true;
    setMicUi(true);
    setListeningStatus(LISTENING_MSG, 'listening-text');
    beginRecordingCycle();
  }

  function setupWebSpeechFallback() {
    if (!SpeechRecognition) return false;
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-SA';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 10;

    recognition.onstart = () => {
      listening = true;
      usingOnDeviceStt = false;
      setMicUi(true);
      setListeningStatus(LISTENING_MSG, 'listening-text');
    };

    recognition.onresult = (event) => {
      if (pauseListeningForAlarm) return;
      let interimText = '';
      const finalParts = [];
      for (let i = 0; i < event.results.length; i++) {
        const res = event.results[i];
        if (res.isFinal) {
          const segmentBest = pickBestTranscript(
            Array.from({ length: res.length }, (_, j) => res[j].transcript)
          );
          if (segmentBest.text) finalParts.push(segmentBest.text);
        } else if (i >= event.resultIndex) {
          interimText += res[0].transcript;
        }
      }
      const assembled = (finalParts.join(' ') + ' ' + interimText).trim();
      if (assembled) applyTranscript(assembled);
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        backgroundListening = false;
        setMicUi(false);
        setListeningStatus('⚠️ فعّل إذن المايك من إعدادات المتصفح', '');
      }
      listening = false;
    };

    recognition.onend = () => {
      listening = false;
      if (softRestarting || pauseListeningForAlarm || usingOnDeviceStt) return;
      if (backgroundListening) {
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => { startWebSpeechCapture(); }, 250);
      }
    };
    return true;
  }

  function startWebSpeechCapture() {
    if (!backgroundListening || pauseListeningForAlarm || !recognition) return;
    usingOnDeviceStt = false;
    try { recognition.start(); } catch (e) {}
  }

  async function startCapture() {
    if (!backgroundListening || pauseListeningForAlarm) return;
    softRestarting = false;
    if (sttEngineReady && !sttEngineDisabled) {
      try {
        await startOnDeviceCapture();
        return;
      } catch (e) {
        disableOnDeviceStt();
      }
    }
    if (recognition) {
      startWebSpeechCapture();
    } else {
      backgroundListening = false;
      setMicUi(false);
      setListeningStatus('البحث الصوتي غير متاح على هذا الجهاز', '');
    }
  }

  function disableBackgroundListening() {
    backgroundListening = false;
    pauseListeningForAlarm = false;
    softRestarting = false;
    clearTimeout(restartTimer);
    clearTimeout(idleResetTimer);
    resetVoiceBuffer();
    stopCapture();
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }
    setMicUi(false);
    setListeningStatus('المايك مقفول', '');
  }

  async function enableBackgroundListening() {
    backgroundListening = true;
    pauseListeningForAlarm = false;
    softRestarting = false;
    resetVoiceBuffer();
    setMicUi(true);
    setListeningStatus(LISTENING_MSG, 'listening-text');
    await startCapture();
  }

  if (voiceSupported) {
    setupWebSpeechFallback();
    preloadSttEngine();

    micBtn.addEventListener('click', () => {
      if (backgroundListening) disableBackgroundListening();
      else enableBackgroundListening();
    });

    onMatchPopupClosed = () => {
      if (backgroundListening && pauseListeningForAlarm) {
        pauseListeningForAlarm = false;
        softRestarting = false;
        resetVoiceBuffer();
        clearTimeout(restartTimer);
        setListeningStatus(LISTENING_MSG, 'listening-text');
        startCapture();
      }
    };
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
    statusLine.textContent = 'البحث الصوتي غير متاح — استخدم الكتابة';
  }

  // ---- Image (OCR) search with interactive crop ----
  const camBtn = document.getElementById('camBtn');
  const camInput = document.getElementById('camInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadInput = document.getElementById('uploadInput');
  const cropOverlay = document.getElementById('cropOverlay');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropConfirm = document.getElementById('cropConfirm');
  const cropCancel = document.getElementById('cropCancel');
  let ocrWorker = null;
  let cropState = null;

  camBtn.addEventListener('click', () => camInput.click());
  uploadBtn.addEventListener('click', () => uploadInput.click());

  function openCropper(file, triggerBtn) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        cropCanvas.width = img.naturalWidth;
        cropCanvas.height = img.naturalHeight;
        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        cropState = { img, ctx, sel: null, dragging: false, startX: 0, startY: 0, triggerBtn };
        cropOverlay.classList.add('active');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getCanvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function redrawWithSelection() {
    if (!cropState) return;
    const { ctx, img, sel } = cropState;
    ctx.drawImage(img, 0, 0, cropCanvas.width, cropCanvas.height);
    if (sel) {
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = Math.max(3, cropCanvas.width * 0.005);
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.fillStyle = 'rgba(212,175,55,0.18)';
      ctx.fillRect(sel.x, sel.y, sel.w, sel.h);
    }
  }

  cropCanvas.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const p = getCanvasPos(e);
    cropState.dragging = true;
    cropState.startX = p.x;
    cropState.startY = p.y;
    cropState.sel = { x: p.x, y: p.y, w: 0, h: 0 };
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (!cropState || !cropState.dragging) return;
    const p = getCanvasPos(e);
    const x = Math.min(p.x, cropState.startX);
    const y = Math.min(p.y, cropState.startY);
    const w = Math.abs(p.x - cropState.startX);
    const h = Math.abs(p.y - cropState.startY);
    cropState.sel = { x, y, w, h };
    redrawWithSelection();
  });
  cropCanvas.addEventListener('pointerup', () => { if (cropState) cropState.dragging = false; });
  cropCanvas.addEventListener('pointercancel', () => { if (cropState) cropState.dragging = false; });

  cropCancel.addEventListener('click', () => {
    cropOverlay.classList.remove('active');
    cropState = null;
  });

  cropConfirm.addEventListener('click', () => {
    if (!cropState) return;
    const { sel, triggerBtn } = cropState;
    cropOverlay.classList.remove('active');

    const cropped = document.createElement('canvas');
    if (sel && sel.w > 15 && sel.h > 10) {
      cropped.width = sel.w;
      cropped.height = sel.h;
      cropped.getContext('2d').drawImage(cropCanvas, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
    } else {
      cropped.width = cropCanvas.width;
      cropped.height = cropCanvas.height;
      cropped.getContext('2d').drawImage(cropCanvas, 0, 0);
    }
    cropped.toBlob((blob) => { runOCR(blob, triggerBtn); }, 'image/png');
    cropState = null;
  });

  // Otsu's method: picks the brightness threshold that best separates a
  // bimodal histogram (dark text vs. bright plate background) instead of
  // a plain mean, which holds up much better under glare, shadows or a
  // dim/uneven photo of the plate.
  function computeOtsuThreshold(gray, n) {
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      let v = gray[i] | 0;
      if (v < 0) v = 0; else if (v > 255) v = 255;
      hist[v]++;
    }
    let sumAll = 0;
    for (let t = 0; t < 256; t++) sumAll += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = n - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sumAll - sumB) / wF;
      const diff = mB - mF;
      const varBetween = wB * wF * diff * diff;
      if (varBetween > maxVar) { maxVar = varBetween; threshold = t; }
    }
    return threshold;
  }

  // Upscale small crops, stretch contrast, then binarize with an adaptive
  // (Otsu) threshold. Plate photos are usually small, low-contrast crops
  // once zoomed in on just the plate — often with glare or uneven lighting —
  // and OCR engines are dramatically more accurate on large, crisply
  // binarized text than on small/dim color photos straight from a phone.
  function preprocessForOCR(sourceCanvas, invert) {
    const MIN_DIM = 800;
    let scale = 1;
    const shortSide = Math.min(sourceCanvas.width, sourceCanvas.height);
    if (shortSide > 0 && shortSide < MIN_DIM) {
      scale = Math.min(5, MIN_DIM / shortSide);
    }

    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    out.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceCanvas, 0, 0, out.width, out.height);

    const imgData = ctx.getImageData(0, 0, out.width, out.height);
    const d = imgData.data;
    const n = d.length / 4;
    const gray = new Float32Array(n);
    let minG = 255, maxG = 0;
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      gray[j] = g;
      if (g < minG) minG = g;
      if (g > maxG) maxG = g;
    }

    // Contrast stretch: spreads whatever narrow brightness range the photo
    // actually used (common with glare, shade or a dim phone photo) across
    // the full 0-255 range before thresholding, so faint text turns solid.
    const range = Math.max(1, maxG - minG);
    for (let j = 0; j < n; j++) {
      gray[j] = ((gray[j] - minG) / range) * 255;
    }

    const threshold = computeOtsuThreshold(gray, n);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      let v = gray[j] > threshold ? 255 : 0;
      if (invert) v = 255 - v;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return out;
  }

  function preprocessVariants(sourceCanvas) {
    return [
      preprocessForOCR(sourceCanvas, false),
      preprocessForOCR(sourceCanvas, true)
    ];
  }

  async function recognizePlateImage(blob) {
    const bitmap = await createImageBitmap(blob);
    const src = document.createElement('canvas');
    src.width = bitmap.width;
    src.height = bitmap.height;
    src.getContext('2d').drawImage(bitmap, 0, 0);

    const psmModes = ['7', '6', '13'];
    let best = { parsed: { letters: '', digits: '', token: '' }, score: -1, text: '' };

    for (const variant of preprocessVariants(src)) {
      const variantBlob = await new Promise(resolve => variant.toBlob(resolve, 'image/png'));
      for (const psm of psmModes) {
        await ocrWorker.setParameters({ tessedit_pageseg_mode: psm });
        const { data } = await ocrWorker.recognize(variantBlob);
        const text = (data && data.text) ? data.text.trim() : '';
        if (!text) continue;
        const parsed = parseOCRPlateText(text);
        const score = scorePlateCandidate(parsed);
        if (score > best.score) {
          best = { parsed, score, text };
        }
      }
    }

    await ocrWorker.setParameters({ tessedit_pageseg_mode: '7' });
    return best;
  }

  async function runOCR(file, triggerBtn) {
    if (!file) return;

    triggerBtn.classList.add('busy');
    statusLine.textContent = '📷 جارٍ قراءة الصورة...';
    statusLine.className = 'status-line listening-text';
    resultsEl.innerHTML = '';

    try {
      if (typeof Tesseract === 'undefined') {
        throw new Error('مكتبة القراءة لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }

      if (!ocrWorker) {
        statusLine.textContent = '📷 جارٍ تجهيز محرك القراءة (أول مرة فقط)...';
        ocrWorker = await Tesseract.createWorker('ara');
        // Saudi plates in this dataset are recorded in Arabic letters + digits
        // only — restricting to that character set (no Latin) removes most
        // of the noise OCR otherwise picks up from backgrounds/other text.
        await ocrWorker.setParameters({
          tessedit_char_whitelist:
            '0123456789٠١٢٣٤٥٦٧٨٩ابتثجحخدذرزسشصضطظعغفقكلمنهويىءأإآؤئة ',
          tessedit_pageseg_mode: '7'
        });
      }

      statusLine.textContent = '📷 جارٍ تحليل الصورة (عدة محاولات)...';
      const best = await recognizePlateImage(file);
      const text = best.text;
      const parsed = best.parsed;

      if (!text || (!parsed.letters && !parsed.digits)) {
        statusLine.textContent = '⚠️ مقدرتش أقرا أي نص من الصورة — جرب تحديد مساحة اللوحة بدقة أكتر';
        statusLine.className = 'status-line';
        renderEmpty();
        return;
      }

      setPlateFields(parsed);
      const found = renderResults(text);
      const display = getPlateStatusLabel() || formatPlateSpeechDisplay(parsed);
      if (found) {
        statusLine.textContent = '✅ قريت: ' + display;
        statusLine.className = 'status-line ok-text';
      } else {
        statusLine.textContent = '⚠️ قريت: ' + display + ' — مفيش تطابق تام في القاعدة';
        statusLine.className = 'status-line listening-text';
      }
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الصورة: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      triggerBtn.classList.remove('busy');
    }
  }


  camInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, camBtn);
    camInput.value = '';
  });

  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, uploadBtn);
    uploadInput.value = '';
  });

  // ---- Excel upload: merge new records into the local (per-device) DB ----
  const excelBtn = document.getElementById('excelBtn');
  const excelInput = document.getElementById('excelInput');
  const clearDataBtn = document.getElementById('clearDataBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmMessage = document.getElementById('confirmMessage');

  excelBtn.addEventListener('click', () => excelInput.click());

  // Recognizes any of: لوحة، اللوحة، لوحه، اللوحه، اللوجه (a common typo)
  function looksLikePlateHeader(cellText) {
    const norm = normalizeArabicLetters(stripTashkeel(cellText || ''));
    return norm.indexOf('لوحه') !== -1 || cellText.indexOf('لوجه') !== -1;
  }

  function parseWorkbookToRecords(workbook) {
    const records = [];
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
      if (!rows || rows.length < 2) continue;

      let headerIdx = -1;
      const cols = {};
      for (let i = 0; i < Math.min(rows.length, 6); i++) {
        const row = (rows[i] || []).map(c => String(c || '').trim());
        const idx = row.findIndex(c => looksLikePlateHeader(c));
        if (idx !== -1) {
          headerIdx = i;
          row.forEach((c, ci) => {
            if (looksLikePlateHeader(c)) cols.plate = ci;
            else if (c.indexOf('نوع') !== -1) cols.type = ci;
            else if (c.indexOf('بنك') !== -1) cols.bank = ci;
            else if (c.indexOf('هيكل') !== -1 || c.indexOf('شاص') !== -1 || c.indexOf('شاس') !== -1) cols.chassis = ci;
          });
          break;
        }
      }
      if (headerIdx === -1 || cols.plate === undefined) continue;

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const plate = String(row[cols.plate] || '').trim();
        if (!plate) continue;
        records.push({
          plate,
          type: cols.type !== undefined ? String(row[cols.type] || '').trim() : '',
          bank: cols.bank !== undefined ? String(row[cols.bank] || '').trim() : '',
          chassis: cols.chassis !== undefined ? String(row[cols.chassis] || '').trim() : ''
        });
      }
    }
    return records;
  }

  excelInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    excelBtn.classList.add('busy');
    statusLine.textContent = '📊 جارٍ قراءة ملف الإكسيل...';
    statusLine.className = 'status-line listening-text';

    try {
      if (typeof XLSX === 'undefined') {
        throw new Error('مكتبة قراءة الإكسيل لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }
      const buf = await file.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array' });
      const parsed = parseWorkbookToRecords(workbook);

      if (parsed.length === 0) {
        statusLine.textContent = '⚠️ مقدرتش ألاقي عمود "اللوحة" في أي شيت — تأكد من شكل الأعمدة';
        statusLine.className = 'status-line';
        return;
      }

      const existingKeys = new Set(normDB.map(r => r.normPlate + '|' + normalizeText(r.chassis || '') + '|' + normalizeText(r.bank || '')));
      const toAdd = [];
      for (const rec of parsed) {
        const normPlate = normalizeText(rec.plate);
        const dedupeKey = normPlate + '|' + normalizeText(rec.chassis || '') + '|' + normalizeText(rec.bank || '');
        if (existingKeys.has(dedupeKey)) continue;
        existingKeys.add(dedupeKey);
        toAdd.push({ dedupeKey, plate: rec.plate, type: rec.type, bank: rec.bank, chassis: rec.chassis, normPlate, source: 'extra' });
      }

      if (toAdd.length === 0) {
        statusLine.textContent = 'ℹ️ كل السجلات في الملف موجودة بالفعل — مفيش حاجة جديدة اتضافت';
        statusLine.className = 'status-line';
        return;
      }

      await putRecords(toAdd);
      // Make sure "seeded" is set so a later refresh doesn't try to re-fetch
      // the base file and overwrite/duplicate what's already in IndexedDB.
      await setMeta('seeded', true);
      for (const r of toAdd) {
        normDB.push({ plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis, normPlate: r.normPlate, source: 'extra' });
      }
      updateCountDisplay();
      statusLine.textContent = '✅ تمت إضافة ' + toAdd.length.toLocaleString('ar-EG') + ' سجل جديد (محفوظ على هذا الجهاز فقط)';
      statusLine.className = 'status-line ok-text';
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الملف: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      excelBtn.classList.remove('busy');
    }
  });

  // ---- Clear ALL data (base + extra + search history) — a full local wipe.
  // After this, a plain page refresh will show an EMPTY database: the base
  // file is intentionally not re-fetched automatically (see clearEverything
  // in db.js), matching "امسح كل حاجة حتى لو عملت ريفريش".
  clearDataBtn.addEventListener('click', () => {
    const totalCount = normDB.length;
    if (totalCount === 0) {
      statusLine.textContent = 'ℹ️ مفيش بيانات على الجهاز ده أصلًا';
      statusLine.className = 'status-line';
      return;
    }
    confirmMessage.textContent = 'هل تريد مسح كل البيانات (' + totalCount.toLocaleString('ar-EG') + ' سجل، شامل القاعدة الأساسية) وسجل البحث من هذا الجهاز؟ بعد المسح، تحديث الصفحة لن يُعيد تحميل البيانات تلقائيًا.';
    confirmOverlay.classList.add('active');
  });

  confirmCancel.addEventListener('click', () => {
    confirmOverlay.classList.remove('active');
  });

  confirmOk.addEventListener('click', async () => {
    confirmOverlay.classList.remove('active');
    try {
      await clearEverything();
      normDB = [];
      updateCountDisplay();
      statusLine.textContent = '✅ اتمسحت كل البيانات وسجل البحث من هذا الجهاز';
      statusLine.className = 'status-line ok-text';
      renderEmpty();
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في المسح: ' + (err.message || err);
      statusLine.className = 'status-line';
    }
  });

  renderEmpty();
})();

</script>
</body>
</html>
