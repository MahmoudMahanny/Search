<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لمّاح">
<meta name="theme-color" content="#071a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2b1c'/%3E%3Cpath d='M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z' fill='%23d4af37'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%230e2b1c'/%3E%3C/svg%3E">
<title>لمّاح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071a12;
    --panel: #0e2b1c;
    --panel-2: #123423;
    --border: #1f4a34;
    --text: #eef4f0;
    --muted: #8fae9c;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .brand-logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  header h1 {
    font-family: 'Almarai', 'Tajawal', 'Segoe UI', sans-serif;
    font-size: 34px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent);
    line-height: 1;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    min-height: 16px;
  }
  header p:empty { display: none; }
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(14, 43, 28, 0.92);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-top: 1px solid var(--border);
    max-width: 560px;
    margin: 0 auto;
  }
  .nav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 12px;
    padding: 7px 4px 5px;
    font-size: 11px;
    text-decoration: none;
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .nav-link .nav-icon { font-size: 20px; line-height: 1; }
  .nav-link:active { transform: scale(0.92); }
  .nav-link.active { color: var(--accent); background: rgba(212,175,55,0.12); }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* ---- Plate-styled search field: mimics a real Saudi license plate
     (white body, bold black digits/letters, green KSA strip + emblem,
     small Latin transliteration line) instead of a plain text input. ---- */
  .plate-frame {
    display: flex;
    align-items: stretch;
    background: linear-gradient(180deg, #ffffff, #f2f2f0);
    border: 3px solid #14140f;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.6);
  }
  .plate-emblem {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: linear-gradient(180deg, #0f7a3c, #0a4f27);
    border-left: 2px solid #14140f;
    padding: 6px 0;
  }
  .plate-emblem .ksa-star { font-size: 13px; line-height: 1; color: #fff7e0; }
  .plate-emblem .ksa-text {
    writing-mode: vertical-rl;
    color: #ffffff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
  }
  .plate-clear {
    background: transparent;
    color: #14140f;
    width: 34px;
  }
  .plate-clear:active { background: rgba(0,0,0,0.06); }
  .plate-input-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    padding: 4px 2px;
  }
  #plateInput {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #14140f;
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    font-weight: 800;
    font-size: 26px;
    padding: 6px 4px 0;
    text-align: center;
    letter-spacing: 4px;
    direction: rtl;
    min-width: 0;
  }
  #plateInput::placeholder {
    color: #8a8a80;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: normal;
  }
  .plate-latin {
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    color: #4a4a42;
    min-height: 14px;
    direction: ltr;
  }
  .plate-hint {
    text-align: center;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
    padding: 0 4px;
  }
  .icon-btn {
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.93); }

  .media-actions {
    display: flex;
    gap: 8px;
  }
  .media-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .media-btn:active { transform: scale(0.95); }
  .media-icon { font-size: 22px; line-height: 1; }
  .media-label { font-size: 11.5px; }
  .media-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1a1a;
  }
  .media-btn-primary .media-label { color: #1a1a1a; }
  .media-btn-primary.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.1s infinite;
  }
  .media-btn-primary.listening .media-label { color: #fff; }
  #camBtn {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
  .media-btn.busy {
    animation: pulse2 1.1s infinite;
  }
  @keyframes pulse2 {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(212,175,55,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .preview-img {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 4px;
  }
  #cropOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #cropOverlay.active { display: flex; }
  #cropCanvasWrap {
    position: relative;
    max-width: 100%;
    max-height: 65vh;
    touch-action: none;
  }
  #cropCanvas {
    max-width: 100%;
    max-height: 65vh;
    display: block;
    border-radius: 8px;
    touch-action: none;
  }
  .crop-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 12px 0 16px;
    line-height: 1.6;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .crop-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #cropConfirm { background: var(--accent); color: #1a1a1a; }
  #cropCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  .secondary-actions {
    display: flex;
    gap: 8px;
  }
  .secondary-btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .secondary-btn:active { transform: scale(0.96); }
  .secondary-btn.busy { opacity: 0.6; animation: pulse2 1.1s infinite; }
  .danger-btn { color: var(--danger); border-color: rgba(224,90,90,0.35); }
  .extra-count-badge {
    text-align: center;
    font-size: 11.5px;
    color: var(--good);
  }

  #confirmOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirmOverlay.active { display: flex; }
  #confirmBox {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 18px;
    max-width: 360px;
    width: 100%;
  }
  #confirmMessage {
    text-align: center;
    font-size: 15px;
    margin-bottom: 18px;
    line-height: 1.7;
  }
  #confirmOk { background: var(--danger); color: #fff; }
  #confirmCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  #clearBtn.plate-clear {
    background: transparent;
    border: none;
    color: #14140f;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224,90,90,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(224,90,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,90,90,0); }
  }
  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
  .status-line.listening-text { color: var(--danger); }
  .status-line.ok-text { color: var(--good); }

  .quickpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .quickpad button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 0;
    font-size: 15px;
    cursor: pointer;
  }
  .quickpad button:active { background: var(--accent-dim); }

  .results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    animation: fadeIn 0.25s ease;
  }
  .result-card.exact {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .plate-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
    direction: rtl;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
  }
  .field-row:first-of-type { border-top: none; }
  .field-label { color: var(--muted); }
  .field-value { color: var(--text); font-weight: 600; text-align: left; direction: ltr; unicode-bidi: plaintext;}

  .empty-state, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }
  .no-results { color: var(--danger); }

  .count-badge {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 24px;
    opacity: 0.6;
  }
</style>
</head>

        <defs>
          <linearGradient id="lammahGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">

        </defs>
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lammahGrad)"/>
        <path d="M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z" fill="#0e2b1c"/>
        <circle cx="32" cy="34" r="7.5" fill="url(#lammahGrad)"/>
        <circle cx="32" cy="34" r="3" fill="#0e2b1c"/>
        <path d="M47 12l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2 2.2-5Z" fill="#fff7e0"/>

      <h1>لمّاح</h1>

    <p id="dbCount">جارٍ تحميل قاعدة البيانات...</p>

  <div class="secondary-actions">
    <button id="excelBtn" class="secondary-btn">📊 إضافة بيانات من إكسيل</button>
    <button id="clearDataBtn" class="secondary-btn danger-btn">🗑️ مسح كل البيانات</button>
    <input id="excelInput" type="file" accept=".xlsx,.xls" style="display:none" />

  <div class="search-box">

    <div class="plate-hint">اكتب حروف اللوحة (٣ حروف) ثم الأرقام من الشمال لليمين — مثال: «عبق ٣٨٤٧»</div>

    <div class="media-actions">
      <button id="camBtn" class="media-btn" title="التقاط صورة">
        <span class="media-icon">📷</span><span class="media-label">كاميرا</span>
      </button>
      <button id="uploadBtn" class="media-btn" title="رفع صورة">
        <span class="media-icon">🖼️</span><span class="media-label">صورة</span>
      </button>
      <button id="micBtn" class="media-btn media-btn-primary" title="بحث صوتي">
        <span class="media-icon">🎤</span><span class="media-label">صوت</span>
      </button>
      <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none" />
      <input id="uploadInput" type="file" accept="image/*" style="display:none" />

    <div id="statusLine" class="status-line"></div>

  <div id="results" class="results"></div>

  <div id="cropOverlay">
    <div id="cropCanvasWrap">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="crop-hint">حدد بإصبعك مكان اللوحة بالظبط، وكل ما كانت المساحة أصغر وأدق كل ما كانت القراءة أفضل</div>
    <div class="crop-actions">
      <button id="cropCancel">إلغاء</button>
      <button id="cropConfirm">قص وابحث ✅</button>
    </div>
  </div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <div id="confirmMessage">هل تريد مسح كل البيانات المضافة؟</div>
      <div class="crop-actions">
        <button id="confirmCancel">إلغاء</button>
        <button id="confirmOk">نعم، امسح ✅</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="db.js"></script>
<script>
(async function () {
  const dbCountEl = document.getElementById('dbCount');
  dbCountEl.textContent = 'جارٍ تحميل قاعدة البيانات...';

  // Global safety net: if ANYTHING below throws unexpectedly and isn't
  // caught locally, show it here instead of leaving the "loading" message
  // stuck forever with no way to diagnose what happened.
  window.addEventListener('error', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  // ---- Load records: from IndexedDB if already seeded on this device,
  // otherwise fetch+decompress the base file once and seed IndexedDB with it.
  // Once "seeded" is set (even after a full clear, which keeps it true with
  // zero rows), the base file is never re-fetched — a refresh after clearing
  // everything will correctly show an empty database, not silently restore it.
  let rawRecords;
  try {
    const alreadySeeded = await getMeta('seeded');
    if (alreadySeeded) {
      rawRecords = await getAllRecords();
    } else {
      const resp = await fetch('plates.txt.gz');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const buf = await resp.arrayBuffer();
      const bytes = new Uint8Array(buf);
      // Check gzip magic number (0x1f 0x8b). Some CDNs (incl. GitHub Pages/Fastly)
      // transparently decompress .gz files server-side via Content-Encoding, in
      // which case buf already holds the plain text and re-decompressing would
      // fail. Detect which case we're in instead of assuming.
      const isGzipped = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
      let text;
      if (isGzipped) {
        if (typeof DecompressionStream === 'undefined') {
          throw new Error('المتصفح لا يدعم فك الضغط — استخدم كروم حديث');
        }
        const ds = new DecompressionStream('gzip');
        const stream = new Blob([buf]).stream().pipeThrough(ds);
        text = await new Response(stream).text();
      } else {
        text = new TextDecoder('utf-8').decode(bytes);
      }
      const lines = text.split('\n').filter(Boolean);
      const seeded = lines.map(line => {
        const parts = line.split('|');
        const plate = parts[0] || '', type = parts[1] || '', bank = parts[2] || '', chassis = parts[3] || '';
        const normPlate = normalizeText(plate);
        return {
          dedupeKey: normPlate + '|' + normalizeText(chassis) + '|' + normalizeText(bank),
          plate, type, bank, chassis, normPlate, source: 'base'
        };
      });
      await putRecords(seeded);
      await setMeta('seeded', true);
      rawRecords = seeded;
    }
  } catch (err) {
    dbCountEl.textContent = '⚠️ تعذر تحميل قاعدة البيانات (' + err.message + ')';
    return;
  }

  const input = document.getElementById('plateInput');
  const plateLatinEl = document.getElementById('plateLatin');
  const micBtn = document.getElementById('micBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusLine = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');

  // Official Arabic->Latin letter mapping used on real Saudi plates (not a
  // simple phonetic transliteration — e.g. Mim -> Z, Ain -> E, Ha -> J).
  const plateLatinMap = {
    'ا': 'A', 'ب': 'B', 'ح': 'J', 'د': 'D', 'ر': 'R', 'س': 'S', 'ص': 'X',
    'ط': 'T', 'ع': 'E', 'ق': 'G', 'ك': 'K', 'ل': 'L', 'م': 'Z', 'ن': 'N',
    'ه': 'H', 'و': 'U', 'ي': 'V', 'ى': 'V'
  };

  // Mirrors the small Latin/Western line printed under the Arabic on a real
  // plate, so the field genuinely looks/behaves like one as you type.
  function updatePlateLatin() {
    if (!plateLatinEl) return;
    const val = input.value || '';
    let letters = '', digits = '';
    for (const ch of val) {
      if (/[0-9]/.test(ch)) digits += ch;
      else if (plateLatinMap[ch]) letters += plateLatinMap[ch];
    }
    plateLatinEl.textContent = letters ? (letters.split('').join(' ') + (digits ? '   ' + digits : '')) : digits;
  }

  // Normalization helpers (normalizeText, normalizeDigits, normalizeArabicLetters,
  // escapeHtml, vibrateFound) are provided globally by db.js, loaded above.

  // Map of Arabic letter *names* spoken aloud -> the letter itself,
  // so voice recognition saying "الف نون قاف" still matches "انق"
  const letterNames = {
    'الف': 'ا', 'أ': 'ا', 'ألف': 'ا',
    'باء': 'ب', 'با': 'ب',
    'تاء': 'ت', 'تا': 'ت',
    'ثاء': 'ث', 'ثا': 'ث',
    'جيم': 'ج',
    'حاء': 'ح', 'حا': 'ح',
    'خاء': 'خ', 'خا': 'خ',
    'دال': 'د',
    'ذال': 'ذ',
    'راء': 'ر', 'را': 'ر',
    'زاي': 'ز', 'زين': 'ز',
    'سين': 'س',
    'شين': 'ش',
    'صاد': 'ص',
    'ضاد': 'ض',
    'طاء': 'ط', 'طا': 'ط',
    'ظاء': 'ظ', 'ظا': 'ظ',
    'عين': 'ع',
    'غين': 'غ',
    'فاء': 'ف', 'فا': 'ف',
    'قاف': 'ق',
    'كاف': 'ك',
    'لام': 'ل',
    'ميم': 'م',
    'نون': 'ن',
    'هاء': 'ه', 'ها': 'ه',
    'واو': 'و',
    'ياء': 'ي', 'يا': 'ي'
  };

  // Spoken number words -> digits. Covers standard MSA forms, forms without
  // the trailing تاء مربوطة ("ثلاث" not just "ثلاثة"), and common
  // Egyptian/Gulf colloquial variants, since either accent may be heard.
  const numberWords = {
    'صفر': '0',
    'واحد': '1', 'وحدة': '1', 'واحده': '1', 'وحده': '1',
    'اثنين': '2', 'اتنين': '2', 'إثنين': '2', 'اثنان': '2', 'ثنين': '2',
    'ثلاثة': '3', 'ثلاث': '3', 'تلاته': '3', 'ثلاثه': '3', 'تلاتة': '3', 'تلات': '3',
    'اربعة': '4', 'اربع': '4', 'أربعة': '4', 'أربع': '4', 'اربعه': '4', 'أربعه': '4',
    'خمسة': '5', 'خمس': '5', 'خمسه': '5',
    'ستة': '6', 'ست': '6', 'سته': '6',
    'سبعة': '7', 'سبع': '7', 'سبعه': '7',
    'ثمانية': '8', 'ثمان': '8', 'ثمانيه': '8', 'تمانية': '8', 'تمانيه': '8', 'تمان': '8',
    'تسعة': '9', 'تسع': '9', 'تسعه': '9'
  };

  // Saudi plates are always exactly 3 Arabic letters followed by up to 4
  // digits (padded with leading zeros), so the parser below fills a
  // dedicated letters buffer (max 3 chars) and digits buffer (max 4 chars)
  // separately instead of blindly concatenating every recognized word — this
  // keeps the result correct even if the speech engine adds stray filler
  // words or repeats something, and it naturally supports every spoken
  // style: full letter names ("دال ميم صاد"), a single glued word that
  // already forms the 3 letters ("دمص"/"عبق"), individual digit words
  // ("ثلاثة ثمانية أربعة سبعة"), or plain digits ("3847" / "٣٨٤٧").
  function parseSaudiPlateSpeech(text) {
    text = normalizeDigits(text);
    text = stripTashkeel(text);
    const words = text.trim().split(/\s+/).filter(Boolean);
    let letters = '';
    let digits = '';

    for (let w of words) {
      const wLower = w.trim();
      if (!wLower) continue;

      if (/^\d+$/.test(wLower)) {
        digits += wLower;
        continue;
      }
      if (numberWords[wLower] !== undefined) {
        digits += numberWords[wLower];
        continue;
      }
      if (letterNames[wLower]) {
        if (letters.length < 3) letters += letterNames[wLower];
        continue;
      }
      // A word made only of Arabic letters: either a single spelled-out
      // letter, or a whole plate segment said as one word (e.g. "عبق").
      const arabicOnly = wLower.replace(/[^\u0621-\u064A]/g, '');
      if (arabicOnly && arabicOnly.length === wLower.length) {
        if (letters.length < 3) letters += arabicOnly.slice(0, 3 - letters.length);
        continue;
      }
      // Fallback: mixed/unrecognized token — salvage any Arabic letters and
      // digits it contains (still respecting the 3-letter/4-digit caps).
      for (const ch of wLower) {
        if (/\d/.test(ch)) { digits += ch; }
        else if (/[\u0621-\u064A]/.test(ch) && letters.length < 3) { letters += ch; }
      }
    }

    letters = normalizeArabicLetters(letters).toLowerCase().slice(0, 3);
    digits = digits.slice(0, 4);
    return { letters, digits, token: letters + digits };
  }

  // Convert a raw spoken/typed phrase into a compact search token
  // e.g. "دال عين 3 6 9 8" -> "دع3698"
  // e.g. "عبق ٣٨٤٧"        -> "عبق3847"
  function transcriptToPlateToken(text) {
    return parseSaudiPlateSpeech(text).token;
  }

  // rawRecords already comes fully normalized (base + any extra records,
  // both stored together in IndexedDB) — no extra merge step needed.
  let normDB = rawRecords.map(r => ({
    plate: r.plate || '', type: r.type || '', bank: r.bank || '',
    chassis: r.chassis || '', normPlate: r.normPlate || normalizeText(r.plate || ''),
    source: r.source || 'base'
  }));

  const extraCountBadge = document.getElementById('extraCountBadge');

  function updateCountDisplay() {
    const extraCount = normDB.filter(r => r.source === 'extra').length;
    // No generic "database: N records" line is shown — keep the header
    // clean; dbCountEl is reserved for loading/error states only.
    dbCountEl.textContent = '';
    if (extraCount > 0) {
      extraCountBadge.style.display = 'block';
      extraCountBadge.textContent = '➕ ' + extraCount.toLocaleString('ar-EG') + ' سجل إضافي محفوظ على هذا الجهاز';
    } else {
      extraCountBadge.style.display = 'none';
    }
  }

  updateCountDisplay();

  function renderEmpty() {
    resultsEl.innerHTML = '<div class="empty-state">اكتب رقم اللوحة يدويًا، أو اضغط 🎤 وقول الحروف الثلاثة ثم الأرقام<br>مثال: قول «عبق» ثم الأرقام من الشمال لليمين «٣٨٤٧» ← عبق ٣٨٤٧</div>';
  }

  function renderResults(query) {
    const token = transcriptToPlateToken(query);
    if (!token) { renderEmpty(); return false; }

    const exact = [];
    const partial = [];

    for (const row of normDB) {
      if (row.normPlate === token) {
        exact.push(row);
      } else if (row.normPlate.includes(token) || token.includes(row.normPlate)) {
        partial.push(row);
      }
    }

    // If exact matches found, show only those (deduped by plate+chassis)
    let list = exact.length ? exact : partial.slice(0, 30);

    // Dedup
    const seen = new Set();
    list = list.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (list.length === 0) {
      resultsEl.innerHTML = '<div class="no-results">⚠️ مفيش نتيجة مطابقة لـ «' + query + '»<br>جرب تتأكد من الحروف أو الأرقام</div>';
      return false;
    }

    const isExact = exact.length > 0;
    let html = '<div class="count-badge">' + (isExact ? '✅ تطابق تام' : '🔎 نتائج قريبة') + ' — ' + list.length + ' نتيجة</div>';

    for (const r of list) {
      html += '<div class="result-card ' + (isExact ? 'exact' : '') + '">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;

    if (isExact) {
      vibrateFound();
      // Log each exact match to the search history (best-effort; never blocks the UI)
      for (const r of exact) {
        addHistoryEntry({
          plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis,
          matchedBy: 'plate', searchedAt: new Date().toISOString()
        }).catch(() => {});
      }
    }
    return isExact;
  }

  function extractDigitsFromNormPlate(normPlate) {
    const m = normPlate.match(/\d+/);
    return m ? m[0] : '';
  }

  // Fallback used when OCR (or a very partial voice/typed query) can't
  // confidently make out the 3 Arabic letters but the 4 digits are clear —
  // still show every plate that has that exact digit sequence, regardless
  // of its letters, rather than giving up with "no results".
  function renderResultsByDigitsOnly(digits) {
    if (!digits) return false;
    const matches = normDB.filter(r => extractDigitsFromNormPlate(r.normPlate) === digits);
    const seen = new Set();
    const list = matches.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    if (list.length === 0) return false;

    let html = '<div class="count-badge">🔢 الحروف مش واضحة — نتائج بالأرقام (' + digits + ') فقط — ' + list.length + ' نتيجة</div>';
    for (const r of list) {
      html += '<div class="result-card">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;
    // Only one possible plate for these digits — confident enough to vibrate.
    if (list.length === 1) vibrateFound();
    return true;
  }

  function fieldRow(label, value) {
    return '<div class="field-row"><span class="field-label">' + label + '</span><span class="field-value">' + escapeHtml(String(value)) + '</span></div>';
  }

  // vibrateFound() and escapeHtml() are provided globally by db.js.

  let debounceTimer = null;
  input.addEventListener('input', () => {
    updatePlateLatin();
    clearTimeout(debounceTimer);
    const val = input.value;
    if (!val.trim()) { renderEmpty(); return; }
    debounceTimer = setTimeout(() => renderResults(val), 150);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    updatePlateLatin();
    renderEmpty();
    statusLine.textContent = '';
    statusLine.className = 'status-line';
    input.focus();
  });

  // ---- Voice recognition ----
  // Each mic press listens for a fixed 5-second window, then automatically
  // stops and searches whatever was said. If it's an exact match, the phone
  // vibrates (vibrateFound(), called from renderResults). If not, the user
  // is asked to speak again and listening restarts automatically for
  // another 5 seconds — no need to keep tapping the mic button.
  const LISTEN_WINDOW_MS = 5000;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let micPermissionGranted = false;
  let continuousMode = false;   // true while the user wants to keep speaking plate after plate
  let restartTimer = null;
  let micTimeout = null;        // enforces the 5-second listening window
  let stoppingForSearch = false; // true when stop() was triggered by the 5s timer (not a manual cancel)
  let finalTranscriptBuffer = '';

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-SA';
    // continuous = true so the engine keeps listening through short pauses
    // for the whole 5-second window, instead of cutting off after the
    // first brief silence.
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      finalTranscriptBuffer = '';
      micBtn.classList.add('listening');
      statusLine.textContent = '🎙️ بيسمعك دلوقتي... اتكلم (٥ ثواني)';
      statusLine.className = 'status-line listening-text';
      clearTimeout(micTimeout);
      micTimeout = setTimeout(() => {
        stoppingForSearch = true;
        try { recognition.stop(); } catch (e) {}
      }, LISTEN_WINDOW_MS);
    };

    recognition.onresult = (event) => {
      let interimText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        if (res.isFinal) {
          finalTranscriptBuffer += res[0].transcript;
        } else {
          interimText += res[0].transcript;
        }
      }
      // Live feedback while still speaking, shown as-is (raw words).
      input.value = (finalTranscriptBuffer + ' ' + interimText).trim();
      updatePlateLatin();
    };

    // Runs once the 5-second window ends (recognition.stop() fires this
    // after flushing any in-progress result): converts whatever was heard
    // into a compact plate token (e.g. "دال ميم صاد" -> "دمص"), shows it
    // in the search box and in the "سمعت" status line, then searches it.
    function finalizeAndSearch() {
      const transcript = finalTranscriptBuffer.trim();
      if (!transcript) {
        statusLine.textContent = '⚠️ مسمعتش حاجة — اتكلم تاني';
        statusLine.className = 'status-line listening-text';
        input.value = '';
        updatePlateLatin();
        return;
      }
      const token = transcriptToPlateToken(transcript) || transcript;
      input.value = token;
      updatePlateLatin();
      const found = renderResults(transcript);
      if (found) {
        // Exact match — vibrateFound() already ran inside renderResults().
        statusLine.textContent = '✅ سمعت: ' + token;
        statusLine.className = 'status-line ok-text';
        continuousMode = false;
      } else {
        statusLine.textContent = '🔁 سمعت: ' + token + ' — مفيش نتيجة، اتكلم تاني';
        statusLine.className = 'status-line listening-text';
        input.value = '';
        updatePlateLatin();
      }
    }

    recognition.onerror = (event) => {
      if (event.error === 'no-speech') {
        // Common and harmless in continuous mode — just try again silently.
        if (continuousMode) return;
      }
      let msg = 'خطأ: ' + event.error;
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        msg = '⚠️ الإذن مرفوض — دوس على 🔒 بجانب العنوان في المتصفح، وفعّل "Microphone"، وارجع افتح الصفحة تاني';
        continuousMode = false;
      } else if (event.error === 'no-speech') {
        msg = '⚠️ مسمعتش حاجة — جرب تاني وقول بصوت أعلى';
      } else if (event.error === 'audio-capture') {
        msg = '⚠️ مفيش مايك متاح على الجهاز ده';
        continuousMode = false;
      } else if (event.error === 'network') {
        msg = '⚠️ خطأ شبكة — التعرف على الصوت محتاج إنترنت';
      }
      statusLine.textContent = msg;
      statusLine.className = 'status-line';
      listening = false;
      stoppingForSearch = false;
      micBtn.classList.remove('listening');
      clearTimeout(micTimeout);
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      clearTimeout(micTimeout);

      if (stoppingForSearch) {
        stoppingForSearch = false;
        finalizeAndSearch();
        if (continuousMode) {
          // Not found (or nothing heard) — automatically start the next
          // 5-second listening window so the person can just talk again.
          clearTimeout(restartTimer);
          restartTimer = setTimeout(() => { startListening(); }, 400);
        }
        return;
      }

      if (continuousMode) {
        // Ended for another reason (e.g. a transient error) while the user
        // still wants to keep listening — restart the window.
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => { startListening(); }, 250);
        return;
      }
      if (!statusLine.classList.contains('ok-text')) {
        statusLine.textContent = '';
        statusLine.className = 'status-line';
      }
    };

    async function startListening() {
      // Request mic permission once and remember it — re-checking every
      // single loop iteration adds a noticeable delay to continuous mode.
      if (!micPermissionGranted && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          micPermissionGranted = true;
        } catch (permErr) {
          statusLine.textContent = '⚠️ مرفوض إذن المايك (' + (permErr.name || permErr.message) + ') — دوس على أيقونة القفل بجانب العنوان وفعّل المايك يدويًا';
          statusLine.className = 'status-line';
          continuousMode = false;
          return;
        }
      }
      try {
        recognition.start();
      } catch (e) {
        // "already started" can happen if a restart race occurs — ignore it.
      }
    }

    micBtn.addEventListener('click', () => {
      if (listening || continuousMode) {
        continuousMode = false;
        stoppingForSearch = false;
        clearTimeout(restartTimer);
        clearTimeout(micTimeout);
        try { recognition.stop(); } catch (e) {}
        statusLine.textContent = '';
        statusLine.className = 'status-line';
        return;
      }
      continuousMode = true;
      startListening();
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
    statusLine.textContent = 'البحث الصوتي مش مدعوم في المتصفح ده — استخدم الكتابة';
  }

  // ---- Image (OCR) search with interactive crop ----
  const camBtn = document.getElementById('camBtn');
  const camInput = document.getElementById('camInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadInput = document.getElementById('uploadInput');
  const cropOverlay = document.getElementById('cropOverlay');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropConfirm = document.getElementById('cropConfirm');
  const cropCancel = document.getElementById('cropCancel');
  let ocrWorker = null;
  let cropState = null;

  camBtn.addEventListener('click', () => camInput.click());
  uploadBtn.addEventListener('click', () => uploadInput.click());

  function openCropper(file, triggerBtn) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        cropCanvas.width = img.naturalWidth;
        cropCanvas.height = img.naturalHeight;
        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        cropState = { img, ctx, sel: null, dragging: false, startX: 0, startY: 0, triggerBtn };
        cropOverlay.classList.add('active');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getCanvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function redrawWithSelection() {
    if (!cropState) return;
    const { ctx, img, sel } = cropState;
    ctx.drawImage(img, 0, 0, cropCanvas.width, cropCanvas.height);
    if (sel) {
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = Math.max(3, cropCanvas.width * 0.005);
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.fillStyle = 'rgba(212,175,55,0.18)';
      ctx.fillRect(sel.x, sel.y, sel.w, sel.h);
    }
  }

  cropCanvas.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const p = getCanvasPos(e);
    cropState.dragging = true;
    cropState.startX = p.x;
    cropState.startY = p.y;
    cropState.sel = { x: p.x, y: p.y, w: 0, h: 0 };
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (!cropState || !cropState.dragging) return;
    const p = getCanvasPos(e);
    const x = Math.min(p.x, cropState.startX);
    const y = Math.min(p.y, cropState.startY);
    const w = Math.abs(p.x - cropState.startX);
    const h = Math.abs(p.y - cropState.startY);
    cropState.sel = { x, y, w, h };
    redrawWithSelection();
  });
  cropCanvas.addEventListener('pointerup', () => { if (cropState) cropState.dragging = false; });
  cropCanvas.addEventListener('pointercancel', () => { if (cropState) cropState.dragging = false; });

  cropCancel.addEventListener('click', () => {
    cropOverlay.classList.remove('active');
    cropState = null;
  });

  cropConfirm.addEventListener('click', () => {
    if (!cropState) return;
    const { sel, triggerBtn } = cropState;
    cropOverlay.classList.remove('active');

    const cropped = document.createElement('canvas');
    if (sel && sel.w > 15 && sel.h > 10) {
      cropped.width = sel.w;
      cropped.height = sel.h;
      cropped.getContext('2d').drawImage(cropCanvas, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
    } else {
      cropped.width = cropCanvas.width;
      cropped.height = cropCanvas.height;
      cropped.getContext('2d').drawImage(cropCanvas, 0, 0);
    }
    const out = preprocessForOCR(cropped);
    out.toBlob((blob) => { runOCR(blob, triggerBtn); }, 'image/png');
    cropState = null;
  });

  // Otsu's method: picks the brightness threshold that best separates a
  // bimodal histogram (dark text vs. bright plate background) instead of
  // a plain mean, which holds up much better under glare, shadows or a
  // dim/uneven photo of the plate.
  function computeOtsuThreshold(gray, n) {
    const hist = new Uint32Array(256);
    for (let i = 0; i < n; i++) {
      let v = gray[i] | 0;
      if (v < 0) v = 0; else if (v > 255) v = 255;
      hist[v]++;
    }
    let sumAll = 0;
    for (let t = 0; t < 256; t++) sumAll += t * hist[t];
    let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t];
      if (wB === 0) continue;
      const wF = n - wB;
      if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sumAll - sumB) / wF;
      const diff = mB - mF;
      const varBetween = wB * wF * diff * diff;
      if (varBetween > maxVar) { maxVar = varBetween; threshold = t; }
    }
    return threshold;
  }

  // Upscale small crops, stretch contrast, then binarize with an adaptive
  // (Otsu) threshold. Plate photos are usually small, low-contrast crops
  // once zoomed in on just the plate — often with glare or uneven lighting —
  // and OCR engines are dramatically more accurate on large, crisply
  // binarized text than on small/dim color photos straight from a phone.
  function preprocessForOCR(sourceCanvas) {
    const MIN_DIM = 640; // upscale so the shorter side is at least this many px
    let scale = 1;
    const shortSide = Math.min(sourceCanvas.width, sourceCanvas.height);
    if (shortSide > 0 && shortSide < MIN_DIM) {
      scale = Math.min(5, MIN_DIM / shortSide);
    }

    const out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    out.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceCanvas, 0, 0, out.width, out.height);

    const imgData = ctx.getImageData(0, 0, out.width, out.height);
    const d = imgData.data;
    const n = d.length / 4;
    const gray = new Float32Array(n);
    let minG = 255, maxG = 0;
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      gray[j] = g;
      if (g < minG) minG = g;
      if (g > maxG) maxG = g;
    }

    // Contrast stretch: spreads whatever narrow brightness range the photo
    // actually used (common with glare, shade or a dim phone photo) across
    // the full 0-255 range before thresholding, so faint text turns solid.
    const range = Math.max(1, maxG - minG);
    for (let j = 0; j < n; j++) {
      gray[j] = ((gray[j] - minG) / range) * 255;
    }

    const threshold = computeOtsuThreshold(gray, n);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const v = gray[j] > threshold ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return out;
  }

  async function runOCR(file, triggerBtn) {
    if (!file) return;

    triggerBtn.classList.add('busy');
    statusLine.textContent = '📷 جارٍ قراءة الصورة...';
    statusLine.className = 'status-line listening-text';
    resultsEl.innerHTML = '';

    try {
      if (typeof Tesseract === 'undefined') {
        throw new Error('مكتبة القراءة لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }

      if (!ocrWorker) {
        statusLine.textContent = '📷 جارٍ تجهيز محرك القراءة (أول مرة فقط)...';
        ocrWorker = await Tesseract.createWorker('ara');
        // Saudi plates in this dataset are recorded in Arabic letters + digits
        // only — restricting to that character set (no Latin) removes most
        // of the noise OCR otherwise picks up from backgrounds/other text.
        await ocrWorker.setParameters({
          tessedit_char_whitelist:
            '0123456789٠١٢٣٤٥٦٧٨٩ابتثجحخدذرزسشصضطظعغفقكلمنهويىءأإآؤئة ',
          // PSM 6 = "assume a single uniform block of text" — a good fit for
          // a tight crop of just the plate (may still have 2 stacked rows).
          tessedit_pageseg_mode: '6'
        });
      }

      statusLine.textContent = '📷 جارٍ تحليل الصورة...';
      const { data } = await ocrWorker.recognize(file);
      const text = (data && data.text) ? data.text.trim() : '';

      if (!text) {
        statusLine.textContent = '⚠️ مقدرتش أقرا أي نص من الصورة — جرب تحديد مساحة اللوحة بدقة أكتر';
        statusLine.className = 'status-line';
        renderEmpty();
        return;
      }

      input.value = text;
      updatePlateLatin();
      const found = renderResults(text);
      if (found) {
        statusLine.textContent = '✅ قريت: ' + text.replace(/\s+/g, ' ');
        statusLine.className = 'status-line ok-text';
      } else {
        // The 3 Arabic letters are the hardest part of a plate photo to OCR
        // reliably (small, sometimes worn stickers/stamps nearby). The 4
        // digits are usually still legible even then, so fall back to
        // searching by digits only instead of reporting a flat failure.
        const parsed = parseSaudiPlateSpeech(text);
        if (parsed.digits.length >= 3 && renderResultsByDigitsOnly(parsed.digits)) {
          statusLine.textContent = '⚠️ قريت الأرقام (' + parsed.digits + ') بس مش متأكد من الحروف — دي النتائج المطابقة للأرقام، تأكد من الحروف يدويًا';
          statusLine.className = 'status-line listening-text';
        } else {
          statusLine.textContent = '✅ قريت: ' + text.replace(/\s+/g, ' ');
          statusLine.className = 'status-line ok-text';
        }
      }
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الصورة: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      triggerBtn.classList.remove('busy');
    }
  }


  camInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, camBtn);
    camInput.value = '';
  });

  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, uploadBtn);
    uploadInput.value = '';
  });

  // ---- Excel upload: merge new records into the local (per-device) DB ----
  const excelBtn = document.getElementById('excelBtn');
  const excelInput = document.getElementById('excelInput');
  const clearDataBtn = document.getElementById('clearDataBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmMessage = document.getElementById('confirmMessage');

  excelBtn.addEventListener('click', () => excelInput.click());

  // Recognizes any of: لوحة، اللوحة، لوحه، اللوحه، اللوجه (a common typo)
  function looksLikePlateHeader(cellText) {
    const norm = normalizeArabicLetters(stripTashkeel(cellText || ''));
    return norm.indexOf('لوحه') !== -1 || cellText.indexOf('لوجه') !== -1;
  }

  function parseWorkbookToRecords(workbook) {
    const records = [];
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
      if (!rows || rows.length < 2) continue;

      let headerIdx = -1;
      const cols = {};
      for (let i = 0; i < Math.min(rows.length, 6); i++) {
        const row = (rows[i] || []).map(c => String(c || '').trim());
        const idx = row.findIndex(c => looksLikePlateHeader(c));
        if (idx !== -1) {
          headerIdx = i;
          row.forEach((c, ci) => {
            if (looksLikePlateHeader(c)) cols.plate = ci;
            else if (c.indexOf('نوع') !== -1) cols.type = ci;
            else if (c.indexOf('بنك') !== -1) cols.bank = ci;
            else if (c.indexOf('هيكل') !== -1 || c.indexOf('شاص') !== -1 || c.indexOf('شاس') !== -1) cols.chassis = ci;
          });
          break;
        }
      }
      if (headerIdx === -1 || cols.plate === undefined) continue;

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const plate = String(row[cols.plate] || '').trim();
        if (!plate) continue;
        records.push({
          plate,
          type: cols.type !== undefined ? String(row[cols.type] || '').trim() : '',
          bank: cols.bank !== undefined ? String(row[cols.bank] || '').trim() : '',
          chassis: cols.chassis !== undefined ? String(row[cols.chassis] || '').trim() : ''
        });
      }
    }
    return records;
  }

  excelInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    excelBtn.classList.add('busy');
    statusLine.textContent = '📊 جارٍ قراءة ملف الإكسيل...';
    statusLine.className = 'status-line listening-text';

    try {
      if (typeof XLSX === 'undefined') {
        throw new Error('مكتبة قراءة الإكسيل لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }
      const buf = await file.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array' });
      const parsed = parseWorkbookToRecords(workbook);

      if (parsed.length === 0) {
        statusLine.textContent = '⚠️ مقدرتش ألاقي عمود "اللوحة" في أي شيت — تأكد من شكل الأعمدة';
        statusLine.className = 'status-line';
        return;
      }

      const existingKeys = new Set(normDB.map(r => r.normPlate + '|' + normalizeText(r.chassis || '') + '|' + normalizeText(r.bank || '')));
      const toAdd = [];
      for (const rec of parsed) {
        const normPlate = normalizeText(rec.plate);
        const dedupeKey = normPlate + '|' + normalizeText(rec.chassis || '') + '|' + normalizeText(rec.bank || '');
        if (existingKeys.has(dedupeKey)) continue;
        existingKeys.add(dedupeKey);
        toAdd.push({ dedupeKey, plate: rec.plate, type: rec.type, bank: rec.bank, chassis: rec.chassis, normPlate, source: 'extra' });
      }

      if (toAdd.length === 0) {
        statusLine.textContent = 'ℹ️ كل السجلات في الملف موجودة بالفعل — مفيش حاجة جديدة اتضافت';
        statusLine.className = 'status-line';
        return;
      }

      await putRecords(toAdd);
      // Make sure "seeded" is set so a later refresh doesn't try to re-fetch
      // the base file and overwrite/duplicate what's already in IndexedDB.
      await setMeta('seeded', true);
      for (const r of toAdd) {
        normDB.push({ plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis, normPlate: r.normPlate, source: 'extra' });
      }
      updateCountDisplay();
      statusLine.textContent = '✅ تمت إضافة ' + toAdd.length.toLocaleString('ar-EG') + ' سجل جديد (محفوظ على هذا الجهاز فقط)';
      statusLine.className = 'status-line ok-text';
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الملف: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      excelBtn.classList.remove('busy');
    }
  });

  // ---- Clear ALL data (base + extra + search history) — a full local wipe.
  // After this, a plain page refresh will show an EMPTY database: the base
  // file is intentionally not re-fetched automatically (see clearEverything
  // in db.js), matching "امسح كل حاجة حتى لو عملت ريفريش".
  clearDataBtn.addEventListener('click', () => {
    const totalCount = normDB.length;
    if (totalCount === 0) {
      statusLine.textContent = 'ℹ️ مفيش بيانات على الجهاز ده أصلًا';
      statusLine.className = 'status-line';
      return;
    }
    confirmMessage.textContent = 'هل تريد مسح كل البيانات (' + totalCount.toLocaleString('ar-EG') + ' سجل، شامل القاعدة الأساسية) وسجل البحث من هذا الجهاز؟ بعد المسح، تحديث الصفحة لن يُعيد تحميل البيانات تلقائيًا.';
    confirmOverlay.classList.add('active');
  });

  confirmCancel.addEventListener('click', () => {
    confirmOverlay.classList.remove('active');
  });

  confirmOk.addEventListener('click', async () => {
    confirmOverlay.classList.remove('active');
    try {
      await clearEverything();
      normDB = [];
      updateCountDisplay();
      statusLine.textContent = '✅ اتمسحت كل البيانات وسجل البحث من هذا الجهاز';
      statusLine.className = 'status-line ok-text';
      renderEmpty();
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في المسح: ' + (err.message || err);
      statusLine.className = 'status-line';
    }
  });

  renderEmpty();
})();

</script>
</body>
</html>
