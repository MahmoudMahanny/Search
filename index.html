<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث اللوحات </title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #eef0f4;
    --muted: #9aa2b1;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 18px;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }
  .search-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 6px 6px 10px;
  }
  #plateInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 20px;
    padding: 10px 4px;
    text-align: center;
    letter-spacing: 1px;
    direction: rtl;
    min-width: 0;
  }
  #plateInput::placeholder {
    color: var(--muted);
    font-size: 15px;
  }
  .icon-btn {
    border: none;
    border-radius: 10px;
    width: 40px;
    height: 40px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .icon-btn:active { transform: scale(0.93); }

  .media-actions {
    display: flex;
    gap: 8px;
  }
  .media-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 12px 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .media-btn:active { transform: scale(0.95); }
  .media-icon { font-size: 22px; line-height: 1; }
  .media-label { font-size: 11.5px; }
  .media-btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a1a1a;
  }
  .media-btn-primary .media-label { color: #1a1a1a; }
  .media-btn-primary.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: pulse 1.1s infinite;
  }
  .media-btn-primary.listening .media-label { color: #fff; }
  #camBtn {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
  .media-btn.busy {
    animation: pulse2 1.1s infinite;
  }
  @keyframes pulse2 {
    0% { box-shadow: 0 0 0 0 rgba(212,175,55,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(212,175,55,0); }
    100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); }
  }
  .preview-img {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-top: 4px;
  }
  #cropOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #cropOverlay.active { display: flex; }
  #cropCanvasWrap {
    position: relative;
    max-width: 100%;
    max-height: 65vh;
    touch-action: none;
  }
  #cropCanvas {
    max-width: 100%;
    max-height: 65vh;
    display: block;
    border-radius: 8px;
    touch-action: none;
  }
  .crop-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: 12px 0 16px;
    line-height: 1.6;
  }
  .crop-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .crop-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #cropConfirm { background: var(--accent); color: #1a1a1a; }
  #cropCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  .secondary-actions {
    display: flex;
    gap: 8px;
  }
  .secondary-btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 12.5px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .secondary-btn:active { transform: scale(0.96); }
  .secondary-btn.busy { opacity: 0.6; animation: pulse2 1.1s infinite; }
  .danger-btn { color: var(--danger); border-color: rgba(224,90,90,0.35); }
  .extra-count-badge {
    text-align: center;
    font-size: 11.5px;
    color: var(--good);
  }

  #confirmOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirmOverlay.active { display: flex; }
  #confirmBox {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 18px;
    max-width: 360px;
    width: 100%;
  }
  #confirmMessage {
    text-align: center;
    font-size: 15px;
    margin-bottom: 18px;
    line-height: 1.7;
  }
  #confirmOk { background: var(--danger); color: #fff; }
  #confirmCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  #clearBtn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(224,90,90,0.55); }
    70% { box-shadow: 0 0 0 12px rgba(224,90,90,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,90,90,0); }
  }
  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
  }
  .status-line.listening-text { color: var(--danger); }
  .status-line.ok-text { color: var(--good); }

  .quickpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .quickpad button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 0;
    font-size: 15px;
    cursor: pointer;
  }
  .quickpad button:active { background: var(--accent-dim); }

  .results {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    animation: fadeIn 0.25s ease;
  }
  .result-card.exact {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .plate-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
    direction: rtl;
  }
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-top: 1px dashed var(--border);
    font-size: 14px;
  }
  .field-row:first-of-type { border-top: none; }
  .field-label { color: var(--muted); }
  .field-value { color: var(--text); font-weight: 600; text-align: left; direction: ltr; unicode-bidi: plaintext;}

  .empty-state, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }
  .no-results { color: var(--danger); }

  .count-badge {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
  }
  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 24px;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 بحث اللوحات </h1>
    <p id="dbCount">جارٍ تحميل قاعدة البيانات...</p>
  </header>

  <div class="secondary-actions">
    <button id="excelBtn" class="secondary-btn">📊 إضافة بيانات من إكسيل</button>
    <button id="clearDataBtn" class="secondary-btn danger-btn">🗑️ مسح البيانات المضافة</button>
    <input id="excelInput" type="file" accept=".xlsx,.xls" style="display:none" />
  </div>
  <div id="extraCountBadge" class="extra-count-badge" style="display:none"></div>

  <div class="search-box">
    <div class="input-row">
      <button id="clearBtn" class="icon-btn" title="مسح">✕</button>
      <input id="plateInput" type="text" placeholder="اكتب رقم اللوحة" autocomplete="off" />
    </div>

    <div class="media-actions">
      <button id="camBtn" class="media-btn" title="التقاط صورة">
        <span class="media-icon">📷</span><span class="media-label">كاميرا</span>
      </button>
      <button id="uploadBtn" class="media-btn" title="رفع صورة">
        <span class="media-icon">🖼️</span><span class="media-label">صورة</span>
      </button>
      <button id="micBtn" class="media-btn media-btn-primary" title="بحث صوتي">
        <span class="media-icon">🎤</span><span class="media-label">صوت</span>
      </button>
      <input id="camInput" type="file" accept="image/*" capture="environment" style="display:none" />
      <input id="uploadInput" type="file" accept="image/*" style="display:none" />
    </div>

    <div id="statusLine" class="status-line"></div>
  </div>

  <div id="results" class="results"></div>

  <div id="cropOverlay">
    <div id="cropCanvasWrap">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="crop-hint">حدد بإصبعك مكان اللوحة بالظبط، وكل ما كانت المساحة أصغر وأدق كل ما كانت القراءة أفضل</div>
    <div class="crop-actions">
      <button id="cropCancel">إلغاء</button>
      <button id="cropConfirm">قص وابحث ✅</button>
    </div>
  </div>

  <div id="confirmOverlay">
    <div id="confirmBox">
      <div id="confirmMessage">هل تريد مسح كل البيانات المضافة؟</div>
      <div class="crop-actions">
        <button id="confirmCancel">إلغاء</button>
        <button id="confirmOk">نعم، امسح ✅</button>
      </div>
    </div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(async function () {
  const dbCountEl = document.getElementById('dbCount');
  dbCountEl.textContent = 'جارٍ تحميل قاعدة البيانات...';

  // Global safety net: if ANYTHING below throws unexpectedly and isn't
  // caught locally, show it here instead of leaving the "loading" message
  // stuck forever with no way to diagnose what happened.
  window.addEventListener('error', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });
  window.addEventListener('unhandledrejection', (e) => {
    if (dbCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      dbCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });

  let rawData;
  try {
    const resp = await fetch('plates.txt.gz');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = await resp.arrayBuffer();
    const bytes = new Uint8Array(buf);
    // Check gzip magic number (0x1f 0x8b). Some CDNs (incl. GitHub Pages/Fastly)
    // transparently decompress .gz files server-side via Content-Encoding, in
    // which case buf already holds the plain text and re-decompressing would
    // fail. Detect which case we're in instead of assuming.
    const isGzipped = bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
    let text;
    if (isGzipped) {
      if (typeof DecompressionStream === 'undefined') {
        throw new Error('المتصفح لا يدعم فك الضغط — استخدم كروم حديث');
      }
      const ds = new DecompressionStream('gzip');
      const stream = new Blob([buf]).stream().pipeThrough(ds);
      text = await new Response(stream).text();
    } else {
      text = new TextDecoder('utf-8').decode(bytes);
    }
    rawData = text.split('\n').filter(Boolean).map(line => line.split('|'));
  } catch (err) {
    dbCountEl.textContent = '⚠️ تعذر تحميل قاعدة البيانات (' + err.message + ')';
    return;
  }
  // rawData: [ [plate, type, bank, chassis], ... ]

  // ---- IndexedDB: locally-added records (per-device only, not shared) ----
  const DB_NAME = 'plateSearchExtraDB';
  const STORE_NAME = 'extra';

  function openExtraDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'dedupeKey' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getAllExtra() {
    try {
      const db = await openExtraDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      return [];
    }
  }

  async function putExtraRecords(records) {
    const db = await openExtraDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      records.forEach(r => store.put(r));
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function clearAllExtra() {
    const db = await openExtraDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  const input = document.getElementById('plateInput');
  const micBtn = document.getElementById('micBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusLine = document.getElementById('statusLine');
  const resultsEl = document.getElementById('results');

  // ---- Normalization helpers ----
  const arabicIndicDigits = '٠١٢٣٤٥٦٧٨٩';
  const easternIndicDigits = '۰۱۲۳۴۵۶۷۸۹';

  function normalizeDigits(str) {
    return str.replace(/[٠-٩]/g, d => String(arabicIndicDigits.indexOf(d)))
               .replace(/[۰-۹]/g, d => String(easternIndicDigits.indexOf(d)));
  }

  function stripTashkeel(str) {
    return str.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');
  }

  function normalizeArabicLetters(str) {
    return str
      .replace(/[إأآا]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ٱ/g, 'ا');
  }

  function normalizeText(str) {
    if (!str) return '';
    str = normalizeDigits(str);
    str = stripTashkeel(str);
    str = normalizeArabicLetters(str);
    str = str.replace(/\s+/g, '');
    str = str.toLowerCase();
    return str;
  }

  // Map of Arabic letter *names* spoken aloud -> the letter itself,
  // so voice recognition saying "الف نون قاف" still matches "انق"
  const letterNames = {
    'الف': 'ا', 'أ': 'ا', 'ألف': 'ا',
    'باء': 'ب', 'با': 'ب',
    'تاء': 'ت', 'تا': 'ت',
    'ثاء': 'ث', 'ثا': 'ث',
    'جيم': 'ج',
    'حاء': 'ح', 'حا': 'ح',
    'خاء': 'خ', 'خا': 'خ',
    'دال': 'د',
    'ذال': 'ذ',
    'راء': 'ر', 'را': 'ر',
    'زاي': 'ز', 'زين': 'ز',
    'سين': 'س',
    'شين': 'ش',
    'صاد': 'ص',
    'ضاد': 'ض',
    'طاء': 'ط', 'طا': 'ط',
    'ظاء': 'ظ', 'ظا': 'ظ',
    'عين': 'ع',
    'غين': 'غ',
    'فاء': 'ف', 'فا': 'ف',
    'قاف': 'ق',
    'كاف': 'ك',
    'لام': 'ل',
    'ميم': 'م',
    'نون': 'ن',
    'هاء': 'ه', 'ها': 'ه',
    'واو': 'و',
    'ياء': 'ي', 'يا': 'ي'
  };

  // Spoken number words -> digits (Egyptian/Gulf colloquial-ish coverage)
  const numberWords = {
    'صفر': '0',
    'واحد': '1', 'وحدة': '1', 'واحده': '1',
    'اثنين': '2', 'اتنين': '2', 'إثنين': '2', 'اثنان': '2',
    'ثلاثة': '3', 'تلاته': '3', 'ثلاثه': '3', 'تلاتة': '3',
    'اربعة': '4', 'أربعة': '4', 'اربعه': '4', 'أربعه': '4',
    'خمسة': '5', 'خمسه': '5',
    'ستة': '6', 'سته': '6',
    'سبعة': '7', 'سبعه': '7',
    'ثمانية': '8', 'ثمانيه': '8', 'تمانية': '8', 'تمانيه': '8',
    'تسعة': '9', 'تسعه': '9'
  };

  // Convert a raw spoken/typed phrase into a compact search token
  // e.g. "دال عين 3 6 9 8" -> "دع3698"
  // e.g. "راء ا ن 5 4 4"  -> "ران544"
  function transcriptToPlateToken(text) {
    text = normalizeDigits(text);
    text = stripTashkeel(text);
    // split into words, keep digit runs intact
    const words = text.trim().split(/\s+/).filter(Boolean);
    let out = '';
    for (let w of words) {
      const wLower = w.trim();
      if (/^\d+$/.test(wLower)) {
        out += wLower;
        continue;
      }
      if (numberWords[wLower]) {
        out += numberWords[wLower];
        continue;
      }
      if (letterNames[wLower]) {
        out += letterNames[wLower];
        continue;
      }
      // single arabic letter already
      if (/^[\u0621-\u064A]$/.test(wLower)) {
        out += wLower;
        continue;
      }
      // fallback: strip and append as-is (letters glued together e.g. "دطط")
      out += wLower.replace(/[^\u0621-\u064A0-9]/g, '');
    }
    return normalizeArabicLetters(out).toLowerCase();
  }

  // Pre-normalize the base DB once for fast search
  let normDB = rawData.map(row => ({
    plate: row[0] || '',
    type: row[1] || '',
    bank: row[2] || '',
    chassis: row[3] || '',
    normPlate: normalizeText(row[0] || ''),
    source: 'base'
  }));

  const extraCountBadge = document.getElementById('extraCountBadge');

  function updateCountDisplay() {
    const baseCount = normDB.filter(r => r.source === 'base').length;
    const extraCount = normDB.filter(r => r.source === 'extra').length;
    dbCountEl.textContent = 'قاعدة البيانات: ' + baseCount.toLocaleString('ar-EG') + ' سجل';
    if (extraCount > 0) {
      extraCountBadge.style.display = 'block';
      extraCountBadge.textContent = '➕ ' + extraCount.toLocaleString('ar-EG') + ' سجل إضافي محفوظ على هذا الجهاز';
    } else {
      extraCountBadge.style.display = 'none';
    }
  }

  // Load any locally-added records from a previous Excel upload on this device
  try {
    const extraRecords = await getAllExtra();
    for (const r of extraRecords) {
      normDB.push({
        plate: r.plate || '', type: r.type || '', bank: r.bank || '',
        chassis: r.chassis || '', normPlate: r.normPlate || normalizeText(r.plate || ''),
        source: 'extra'
      });
    }
  } catch (e) { /* ignore — extra data is optional */ }

  updateCountDisplay();

  function renderEmpty() {
    resultsEl.innerHTML = '<div class="empty-state">اكتب رقم اللوحة يدويًا، أو اضغط 🎤 وقول الحروف والأرقام<br>مثال: «دال عين 3 6 9 8»</div>';
  }

  function renderResults(query) {
    const token = transcriptToPlateToken(query);
    if (!token) { renderEmpty(); return false; }

    const exact = [];
    const partial = [];

    for (const row of normDB) {
      if (row.normPlate === token) {
        exact.push(row);
      } else if (row.normPlate.includes(token) || token.includes(row.normPlate)) {
        partial.push(row);
      }
    }

    // If exact matches found, show only those (deduped by plate+chassis)
    let list = exact.length ? exact : partial.slice(0, 30);

    // Dedup
    const seen = new Set();
    list = list.filter(r => {
      const key = r.plate + '|' + r.chassis + '|' + r.bank;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    if (list.length === 0) {
      resultsEl.innerHTML = '<div class="no-results">⚠️ مفيش نتيجة مطابقة لـ «' + query + '»<br>جرب تتأكد من الحروف أو الأرقام</div>';
      return false;
    }

    const isExact = exact.length > 0;
    let html = '<div class="count-badge">' + (isExact ? '✅ تطابق تام' : '🔎 نتائج قريبة') + ' — ' + list.length + ' نتيجة</div>';

    for (const r of list) {
      html += '<div class="result-card ' + (isExact ? 'exact' : '') + '">';
      html += '<div class="plate-num">' + escapeHtml(r.plate) + '</div>';
      if (r.type) html += fieldRow('النوع', r.type);
      if (r.bank) html += fieldRow('البنك', r.bank);
      if (r.chassis) html += fieldRow('الهيكل', r.chassis);
      html += '</div>';
    }
    resultsEl.innerHTML = html;

    if (isExact) vibrateFound();
    return isExact;
  }

  function fieldRow(label, value) {
    return '<div class="field-row"><span class="field-label">' + label + '</span><span class="field-value">' + escapeHtml(String(value)) + '</span></div>';
  }

  // Long vibration (10s) to signal a confirmed exact match — useful when the
  // person's attention is on the car/plate, not the screen.
  function vibrateFound() {
    if (navigator.vibrate) {
      try { navigator.vibrate(10000); } catch (e) { /* ignore */ }
    }
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let debounceTimer = null;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = input.value;
    if (!val.trim()) { renderEmpty(); return; }
    debounceTimer = setTimeout(() => renderResults(val), 150);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    renderEmpty();
    statusLine.textContent = '';
    statusLine.className = 'status-line';
    input.focus();
  });

  // ---- Voice recognition (continuous multi-query mode) ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let micPermissionGranted = false;
  let continuousMode = false;   // true while the user wants to keep speaking plate after plate
  let restartTimer = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-SA';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      statusLine.textContent = '🎙️ بيسمعك دلوقتي... اتكلم';
      statusLine.className = 'status-line listening-text';
    };

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      input.value = transcript;
      const lastResult = event.results[event.results.length - 1];

      if (lastResult.isFinal) {
        const found = renderResults(transcript);
        if (found) {
          // Exact match — stop the loop, keep the result on screen.
          statusLine.textContent = '✅ سمعت: ' + transcript;
          statusLine.className = 'status-line ok-text';
          continuousMode = false;
        } else {
          // Not found — clear the box and keep listening so the person can
          // just say the next plate right away without pressing the mic again.
          statusLine.textContent = '🔁 مفيش نتيجة لـ «' + transcript + '» — قول رقم تاني...';
          statusLine.className = 'status-line listening-text';
          input.value = '';
        }
      } else {
        // Quick live feedback while still speaking — try searching the
        // interim transcript too; if it already matches exactly, no need
        // to wait for the "final" event, which cuts perceived latency a lot.
        const found = renderResults(transcript);
        if (found) {
          statusLine.textContent = '✅ سمعت: ' + transcript;
          statusLine.className = 'status-line ok-text';
          continuousMode = false;
          try { recognition.stop(); } catch (e) {}
        }
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech') {
        // Common and harmless in continuous mode — just try again silently.
        if (continuousMode) return;
      }
      let msg = 'خطأ: ' + event.error;
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        msg = '⚠️ الإذن مرفوض — دوس على 🔒 بجانب العنوان في المتصفح، وفعّل "Microphone"، وارجع افتح الصفحة تاني';
        continuousMode = false;
      } else if (event.error === 'no-speech') {
        msg = '⚠️ مسمعتش حاجة — جرب تاني وقول بصوت أعلى';
      } else if (event.error === 'audio-capture') {
        msg = '⚠️ مفيش مايك متاح على الجهاز ده';
        continuousMode = false;
      } else if (event.error === 'network') {
        msg = '⚠️ خطأ شبكة — التعرف على الصوت محتاج إنترنت';
      }
      statusLine.textContent = msg;
      statusLine.className = 'status-line';
      listening = false;
      micBtn.classList.remove('listening');
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      if (continuousMode) {
        // Restart almost immediately so multi-plate voice search feels
        // seamless instead of requiring a fresh tap on the mic each time.
        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => { startListening(); }, 250);
        return;
      }
      if (!statusLine.classList.contains('ok-text')) {
        statusLine.textContent = '';
        statusLine.className = 'status-line';
      }
    };

    async function startListening() {
      // Request mic permission once and remember it — re-checking every
      // single loop iteration adds a noticeable delay to continuous mode.
      if (!micPermissionGranted && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
          micPermissionGranted = true;
        } catch (permErr) {
          statusLine.textContent = '⚠️ مرفوض إذن المايك (' + (permErr.name || permErr.message) + ') — دوس على أيقونة القفل بجانب العنوان وفعّل المايك يدويًا';
          statusLine.className = 'status-line';
          continuousMode = false;
          return;
        }
      }
      try {
        recognition.start();
      } catch (e) {
        // "already started" can happen if a restart race occurs — ignore it.
      }
    }

    micBtn.addEventListener('click', () => {
      if (listening || continuousMode) {
        continuousMode = false;
        clearTimeout(restartTimer);
        try { recognition.stop(); } catch (e) {}
        return;
      }
      continuousMode = true;
      startListening();
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
    statusLine.textContent = 'البحث الصوتي مش مدعوم في المتصفح ده — استخدم الكتابة';
  }

  // ---- Image (OCR) search with interactive crop ----
  const camBtn = document.getElementById('camBtn');
  const camInput = document.getElementById('camInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadInput = document.getElementById('uploadInput');
  const cropOverlay = document.getElementById('cropOverlay');
  const cropCanvas = document.getElementById('cropCanvas');
  const cropConfirm = document.getElementById('cropConfirm');
  const cropCancel = document.getElementById('cropCancel');
  let ocrWorker = null;
  let cropState = null;

  camBtn.addEventListener('click', () => camInput.click());
  uploadBtn.addEventListener('click', () => uploadInput.click());

  function openCropper(file, triggerBtn) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        cropCanvas.width = img.naturalWidth;
        cropCanvas.height = img.naturalHeight;
        const ctx = cropCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        cropState = { img, ctx, sel: null, dragging: false, startX: 0, startY: 0, triggerBtn };
        cropOverlay.classList.add('active');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getCanvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  function redrawWithSelection() {
    if (!cropState) return;
    const { ctx, img, sel } = cropState;
    ctx.drawImage(img, 0, 0, cropCanvas.width, cropCanvas.height);
    if (sel) {
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = Math.max(3, cropCanvas.width * 0.005);
      ctx.strokeRect(sel.x, sel.y, sel.w, sel.h);
      ctx.fillStyle = 'rgba(212,175,55,0.18)';
      ctx.fillRect(sel.x, sel.y, sel.w, sel.h);
    }
  }

  cropCanvas.addEventListener('pointerdown', (e) => {
    if (!cropState) return;
    const p = getCanvasPos(e);
    cropState.dragging = true;
    cropState.startX = p.x;
    cropState.startY = p.y;
    cropState.sel = { x: p.x, y: p.y, w: 0, h: 0 };
  });
  cropCanvas.addEventListener('pointermove', (e) => {
    if (!cropState || !cropState.dragging) return;
    const p = getCanvasPos(e);
    const x = Math.min(p.x, cropState.startX);
    const y = Math.min(p.y, cropState.startY);
    const w = Math.abs(p.x - cropState.startX);
    const h = Math.abs(p.y - cropState.startY);
    cropState.sel = { x, y, w, h };
    redrawWithSelection();
  });
  cropCanvas.addEventListener('pointerup', () => { if (cropState) cropState.dragging = false; });
  cropCanvas.addEventListener('pointercancel', () => { if (cropState) cropState.dragging = false; });

  cropCancel.addEventListener('click', () => {
    cropOverlay.classList.remove('active');
    cropState = null;
  });

  cropConfirm.addEventListener('click', () => {
    if (!cropState) return;
    const { sel, triggerBtn } = cropState;
    cropOverlay.classList.remove('active');

    const out = document.createElement('canvas');
    if (sel && sel.w > 15 && sel.h > 10) {
      out.width = sel.w;
      out.height = sel.h;
      out.getContext('2d').drawImage(cropCanvas, sel.x, sel.y, sel.w, sel.h, 0, 0, sel.w, sel.h);
    } else {
      out.width = cropCanvas.width;
      out.height = cropCanvas.height;
      out.getContext('2d').drawImage(cropCanvas, 0, 0);
    }
    out.toBlob((blob) => { runOCR(blob, triggerBtn); }, 'image/png');
    cropState = null;
  });

  async function runOCR(file, triggerBtn) {
    if (!file) return;

    triggerBtn.classList.add('busy');
    statusLine.textContent = '📷 جارٍ قراءة الصورة...';
    statusLine.className = 'status-line listening-text';
    resultsEl.innerHTML = '';

    try {
      if (typeof Tesseract === 'undefined') {
        throw new Error('مكتبة القراءة لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }

      if (!ocrWorker) {
        statusLine.textContent = '📷 جارٍ تجهيز محرك القراءة (أول مرة فقط)...';
        ocrWorker = await Tesseract.createWorker('ara');
        // Saudi plates in this dataset are recorded in Arabic letters + digits
        // only — restricting to that character set (no Latin) removes most
        // of the noise OCR otherwise picks up from backgrounds/other text.
        await ocrWorker.setParameters({
          tessedit_char_whitelist:
            '0123456789٠١٢٣٤٥٦٧٨٩ابتثجحخدذرزسشصضطظعغفقكلمنهويىءأإآؤئة '
        });
      }

      statusLine.textContent = '📷 جارٍ تحليل الصورة...';
      const { data } = await ocrWorker.recognize(file);
      const text = (data && data.text) ? data.text.trim() : '';

      if (!text) {
        statusLine.textContent = '⚠️ مقدرتش أقرا أي نص من الصورة — جرب تحديد مساحة اللوحة بدقة أكتر';
        statusLine.className = 'status-line';
        renderEmpty();
        return;
      }

      input.value = text;
      statusLine.textContent = '✅ قريت: ' + text.replace(/\s+/g, ' ');
      statusLine.className = 'status-line ok-text';
      renderResults(text);
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الصورة: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      triggerBtn.classList.remove('busy');
    }
  }

  camInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, camBtn);
    camInput.value = '';
  });

  uploadInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    openCropper(file, uploadBtn);
    uploadInput.value = '';
  });

  // ---- Excel upload: merge new records into the local (per-device) DB ----
  const excelBtn = document.getElementById('excelBtn');
  const excelInput = document.getElementById('excelInput');
  const clearDataBtn = document.getElementById('clearDataBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');
  const confirmMessage = document.getElementById('confirmMessage');

  excelBtn.addEventListener('click', () => excelInput.click());

  function parseWorkbookToRecords(workbook) {
    const records = [];
    for (const sheetName of workbook.SheetNames) {
      const sheet = workbook.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
      if (!rows || rows.length < 2) continue;

      let headerIdx = -1;
      const cols = {};
      for (let i = 0; i < Math.min(rows.length, 6); i++) {
        const row = (rows[i] || []).map(c => String(c || '').trim());
        const idx = row.findIndex(c => c.indexOf('لوحة') !== -1);
        if (idx !== -1) {
          headerIdx = i;
          row.forEach((c, ci) => {
            if (c.indexOf('لوحة') !== -1) cols.plate = ci;
            else if (c.indexOf('نوع') !== -1) cols.type = ci;
            else if (c.indexOf('بنك') !== -1) cols.bank = ci;
            else if (c.indexOf('هيكل') !== -1 || c.indexOf('شاصي') !== -1) cols.chassis = ci;
          });
          break;
        }
      }
      if (headerIdx === -1 || cols.plate === undefined) continue;

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        const plate = String(row[cols.plate] || '').trim();
        if (!plate) continue;
        records.push({
          plate,
          type: cols.type !== undefined ? String(row[cols.type] || '').trim() : '',
          bank: cols.bank !== undefined ? String(row[cols.bank] || '').trim() : '',
          chassis: cols.chassis !== undefined ? String(row[cols.chassis] || '').trim() : ''
        });
      }
    }
    return records;
  }

  excelInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    excelBtn.classList.add('busy');
    statusLine.textContent = '📊 جارٍ قراءة ملف الإكسيل...';
    statusLine.className = 'status-line listening-text';

    try {
      if (typeof XLSX === 'undefined') {
        throw new Error('مكتبة قراءة الإكسيل لم تُحمَّل — تأكد من الاتصال بالإنترنت');
      }
      const buf = await file.arrayBuffer();
      const workbook = XLSX.read(buf, { type: 'array' });
      const parsed = parseWorkbookToRecords(workbook);

      if (parsed.length === 0) {
        statusLine.textContent = '⚠️ مقدرتش ألاقي عمود "اللوحة" في أي شيت — تأكد من شكل الأعمدة';
        statusLine.className = 'status-line';
        return;
      }

      const existingKeys = new Set(normDB.map(r => r.normPlate + '|' + normalizeText(r.chassis || '')));
      const toAdd = [];
      for (const rec of parsed) {
        const normPlate = normalizeText(rec.plate);
        const dedupeKey = normPlate + '|' + normalizeText(rec.chassis || '');
        if (existingKeys.has(dedupeKey)) continue;
        existingKeys.add(dedupeKey);
        toAdd.push({ dedupeKey, plate: rec.plate, type: rec.type, bank: rec.bank, chassis: rec.chassis, normPlate });
      }

      if (toAdd.length === 0) {
        statusLine.textContent = 'ℹ️ كل السجلات في الملف موجودة بالفعل — مفيش حاجة جديدة اتضافت';
        statusLine.className = 'status-line';
        return;
      }

      await putExtraRecords(toAdd);
      for (const r of toAdd) {
        normDB.push({ plate: r.plate, type: r.type, bank: r.bank, chassis: r.chassis, normPlate: r.normPlate, source: 'extra' });
      }
      updateCountDisplay();
      statusLine.textContent = '✅ تمت إضافة ' + toAdd.length.toLocaleString('ar-EG') + ' سجل جديد (محفوظ على هذا الجهاز فقط)';
      statusLine.className = 'status-line ok-text';
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في قراءة الملف: ' + (err.message || err);
      statusLine.className = 'status-line';
    } finally {
      excelBtn.classList.remove('busy');
    }
  });

  // ---- Clear locally-added data (with confirmation) ----
  clearDataBtn.addEventListener('click', () => {
    const extraCount = normDB.filter(r => r.source === 'extra').length;
    if (extraCount === 0) {
      statusLine.textContent = 'ℹ️ مفيش بيانات إضافية متخزنة على هذا الجهاز أصلًا';
      statusLine.className = 'status-line';
      return;
    }
    confirmMessage.textContent = 'هل تريد مسح كل البيانات المضافة (' + extraCount.toLocaleString('ar-EG') + ' سجل) من هذا الجهاز؟ القاعدة الأساسية لن تتأثر.';
    confirmOverlay.classList.add('active');
  });

  confirmCancel.addEventListener('click', () => {
    confirmOverlay.classList.remove('active');
  });

  confirmOk.addEventListener('click', async () => {
    confirmOverlay.classList.remove('active');
    try {
      await clearAllExtra();
      normDB = normDB.filter(r => r.source !== 'extra');
      updateCountDisplay();
      statusLine.textContent = '✅ اتمسحت كل البيانات المضافة';
      statusLine.className = 'status-line ok-text';
      renderEmpty();
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في المسح: ' + (err.message || err);
      statusLine.className = 'status-line';
    }
  });

  renderEmpty();
})();

</script>
</body>
</html>
