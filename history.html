<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لمّاح">
<meta name="theme-color" content="#071a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2b1c'/%3E%3Cpath d='M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z' fill='%23d4af37'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%230e2b1c'/%3E%3C/svg%3E">
<title>لمّاح — سجل البحث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #071a12;
    --panel: #0e2b1c;
    --panel-2: #123423;
    --border: #1f4a34;
    --text: #eef4f0;
    --muted: #8fae9c;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  .wrap {
    max-width: 700px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .brand-logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
  }
  header h1 {
    font-family: 'Almarai', 'Tajawal', 'Segoe UI', sans-serif;
    font-size: 28px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--accent);
    line-height: 1;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 12.5px;
    min-height: 16px;
  }
  .bottom-nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    display: flex;
    gap: 6px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: rgba(14, 43, 28, 0.92);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-top: 1px solid var(--border);
    max-width: 700px;
    margin: 0 auto;
  }
  .nav-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    background: transparent;
    border: none;
    color: var(--muted);
    border-radius: 12px;
    padding: 7px 4px 5px;
    font-size: 11px;
    text-decoration: none;
    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .nav-link .nav-icon { font-size: 20px; line-height: 1; }
  .nav-link:active { transform: scale(0.92); }
  .nav-link.active { color: var(--accent); background: rgba(212,175,55,0.12); }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .toolbar button {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 9px 4px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .toolbar .danger-btn { color: var(--danger); border-color: rgba(224,90,90,0.35); }

  .status-line {
    min-height: 18px;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  .status-line.ok-text { color: var(--good); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    font-size: 13px;
  }
  th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: var(--panel-2);
    color: var(--accent);
    font-size: 12px;
    white-space: nowrap;
  }
  td.plate-cell { font-weight: 700; color: var(--accent); direction: rtl; }
  td.chassis-cell { direction: ltr; font-size: 12px; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .match-badge {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--muted);
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
    line-height: 1.8;
  }

  #confirmOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirmOverlay.active { display: flex; }
  #confirmBox {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 18px;
    max-width: 360px;
    width: 100%;
  }
  #confirmMessage {
    text-align: center;
    font-size: 15px;
    margin-bottom: 18px;
    line-height: 1.7;
  }
  .confirm-actions {
    display: flex;
    gap: 10px;
  }
  .confirm-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #confirmOk { background: var(--danger); color: #fff; }
  #confirmCancel { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }

  @media (max-width: 480px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr {
      background: var(--panel-2);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 8px;
    }
    td {
      border: none;
      text-align: right;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
    }
    td::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 11px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="lammahGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f3d47c"/>
            <stop offset="1" stop-color="#b8892a"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lammahGrad)"/>
        <path d="M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z" fill="#0e2b1c"/>
        <circle cx="32" cy="34" r="7.5" fill="url(#lammahGrad)"/>
        <circle cx="32" cy="34" r="3" fill="#0e2b1c"/>
        <path d="M47 12l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2 2.2-5Z" fill="#fff7e0"/>
      </svg>
      <h1>📋 سجل البحث</h1>
    </div>
    <p id="historyCount">جارٍ تحميل السجل...</p>
  </header>

  <div class="toolbar">
    <button id="clearHistoryBtn" class="danger-btn">🗑️ مسح السجل فقط</button>
  </div>

  <div id="statusLine" class="status-line"></div>

  <div id="tableWrap"></div>
</div>

<div id="confirmOverlay">
  <div id="confirmBox">
    <div id="confirmMessage">هل تريد مسح سجل عمليات البحث؟</div>
    <div class="confirm-actions">
      <button id="confirmCancel">إلغاء</button>
      <button id="confirmOk">نعم، امسح ✅</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-link"><span class="nav-icon">🔍</span>بحث باللوحة</a>
  <a href="chassis.html" class="nav-link"><span class="nav-icon">🔧</span>بحث بالهيكل</a>
  <a href="history.html" class="nav-link active"><span class="nav-icon">📋</span>السجل</a>
</nav>

<script src="db.js"></script>
<script>
(async function () {
  const historyCountEl = document.getElementById('historyCount');
  const tableWrap = document.getElementById('tableWrap');
  const statusLine = document.getElementById('statusLine');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmOk = document.getElementById('confirmOk');
  const confirmCancel = document.getElementById('confirmCancel');

  window.addEventListener('error', (e) => {
    if (historyCountEl.textContent.indexOf('جارٍ تحميل') === 0) {
      historyCountEl.textContent = '⚠️ خطأ غير متوقع: ' + (e.message || e.error);
    }
  });

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (e) {
      return iso;
    }
  }

  async function loadAndRender() {
    let history;
    try {
      history = await getAllHistory();
    } catch (err) {
      historyCountEl.textContent = '⚠️ تعذر تحميل السجل (' + err.message + ')';
      return;
    }

    // Most recent first
    history.sort((a, b) => (b.searchedAt || '').localeCompare(a.searchedAt || ''));

    historyCountEl.textContent = 'إجمالي عمليات البحث الناجحة: ' + history.length.toLocaleString('ar-EG');

    if (history.length === 0) {
      tableWrap.innerHTML = '<div class="empty-state">مفيش عمليات بحث ناجحة متسجلة لسه.<br>أي تطابق تام في صفحة البحث باللوحة أو الهيكل بيتسجل هنا تلقائيًا.</div>';
      return;
    }

    let html = '<table><thead><tr>' +
      '<th>اللوحة</th><th>النوع</th><th>البنك</th><th>الهيكل</th><th>طريقة البحث</th><th>الوقت والتاريخ</th>' +
      '</tr></thead><tbody>';

    for (const h of history) {
      const matchLabel = h.matchedBy === 'chassis' ? 'بالهيكل' : 'باللوحة';
      html += '<tr>' +
        '<td data-label="اللوحة" class="plate-cell">' + escapeHtml(h.plate || '') + '</td>' +
        '<td data-label="النوع">' + escapeHtml(h.type || '') + '</td>' +
        '<td data-label="البنك">' + escapeHtml(h.bank || '') + '</td>' +
        '<td data-label="الهيكل" class="chassis-cell">' + escapeHtml(h.chassis || '') + '</td>' +
        '<td data-label="طريقة البحث"><span class="match-badge">' + matchLabel + '</span></td>' +
        '<td data-label="الوقت والتاريخ">' + formatDate(h.searchedAt) + '</td>' +
        '</tr>';
    }
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
  }

  clearHistoryBtn.addEventListener('click', async () => {
    let history;
    try { history = await getAllHistory(); } catch (e) { history = []; }
    if (history.length === 0) {
      statusLine.textContent = 'ℹ️ السجل فارغ أصلًا';
      statusLine.className = 'status-line';
      return;
    }
    document.getElementById('confirmMessage').textContent =
      'هل تريد مسح سجل عمليات البحث (' + history.length.toLocaleString('ar-EG') + ' عملية)؟ بيانات اللوحات نفسها لن تتأثر.';
    confirmOverlay.classList.add('active');
  });

  confirmCancel.addEventListener('click', () => {
    confirmOverlay.classList.remove('active');
  });

  confirmOk.addEventListener('click', async () => {
    confirmOverlay.classList.remove('active');
    try {
      await clearAllHistory();
      statusLine.textContent = '✅ اتمسح السجل';
      statusLine.className = 'status-line ok-text';
      loadAndRender();
    } catch (err) {
      statusLine.textContent = '⚠️ خطأ في المسح: ' + (err.message || err);
      statusLine.className = 'status-line';
    }
  });

  loadAndRender();
})();
</script>
</body>
</html>
