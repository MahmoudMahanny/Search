<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لمّاح">
<meta name="theme-color" content="#071a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e2b1c'/%3E%3Cpath d='M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z' fill='%23d4af37'/%3E%3Ccircle cx='32' cy='34' r='7' fill='%230e2b1c'/%3E%3C/svg%3E">
<title>لمّاح — الإعدادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  :root {
    --bg: #071a12;
    --panel: #0e2b1c;
    --panel-2: #123423;
    --border: #1f4a34;
    --text: #eef4f0;
    --muted: #8fae9c;
    --accent: #d4af37;
    --accent-dim: #8a742a;
    --good: #4caf7d;
    --danger: #e05a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .brand-logo { width: 46px; height: 46px; }
  header h1 {
    font-family: 'Almarai', 'Tajawal', sans-serif;
    font-size: 28px; font-weight: 800; margin: 0; color: var(--accent);
  }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .settings-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
  }
  .settings-row + .settings-row { border-top: 1px solid var(--border); }
  .settings-label { font-size: 14px; font-weight: 700; }
  .settings-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .theme-toggle {
    display: flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .theme-toggle button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .theme-toggle button.active {
    background: var(--accent);
    color: #1a1408;
  }
  .version-badge {
    font-family: 'Almarai', sans-serif;
    font-weight: 800;
    color: var(--accent);
    font-size: 16px;
  }
  .update-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    background: var(--accent);
    color: #1a1408;
  }
  .update-btn:disabled { opacity: 0.55; }
  .update-status {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 18px;
  }
  .update-status.ok { color: var(--good); }
  .update-status.warn { color: var(--accent); }
  .update-status.err { color: var(--danger); }
  .update-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 120;
    display: none; align-items: center; gap: 8px;
    padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
    background: linear-gradient(180deg, #1a4d32, #0e2b1c);
    border-bottom: 2px solid var(--accent);
    max-width: 560px; margin: 0 auto;
  }
  .update-banner.visible { display: flex; }
  body.has-update-banner .wrap { padding-top: calc(58px + env(safe-area-inset-top)); }
  .update-banner-text { flex: 1; font-size: 12.5px; line-height: 1.35; }
  .update-banner-text strong { display: block; color: var(--accent); font-size: 13px; margin-bottom: 2px; }
  .update-banner-text span { color: var(--muted); }
  .update-banner-btn {
    flex-shrink: 0; background: var(--accent); color: #1a1408; border: none;
    border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 800; font-family: inherit;
  }
  .update-banner-dismiss {
    flex-shrink: 0; background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 4px;
  }
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; gap: 4px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: rgba(14, 43, 28, 0.92);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    max-width: 560px; margin: 0 auto;
  }
  html[data-theme="light"] .bottom-nav { background: rgba(255,255,255,0.92); }
  .nav-link {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    text-decoration: none; color: var(--muted); border-radius: 12px; padding: 7px 2px 5px; font-size: 10px;
  }
  .nav-link .nav-icon { font-size: 18px; }
  .nav-link.active { color: var(--accent); background: rgba(212,175,55,0.12); }
</style>
</head>
<body>
<div id="updateBanner" class="update-banner" role="dialog" aria-live="polite">
  <div class="update-banner-text">
    <strong>🔄 تحديث جديد متاح</strong>
    <span id="updateBannerMsg"></span>
  </div>
  <button type="button" id="updateBannerBtn" class="update-banner-btn">تحديث الآن</button>
  <button type="button" id="updateBannerDismiss" class="update-banner-dismiss" aria-label="إخفاء">✕</button>
</div>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="#d4af37"/>
        <path d="M12 34c7-13 33-13 40 0-7 13-33 13-40 0Z" fill="#0e2b1c"/>
        <circle cx="32" cy="34" r="7.5" fill="#d4af37"/>
        <circle cx="32" cy="34" r="3" fill="#0e2b1c"/>
      </svg>
      <h1>الإعدادات</h1>
    </div>
    <p>المظهر ومعلومات النسخة</p>
  </header>

  <div class="settings-card">
    <div class="settings-row">
      <div>
        <div class="settings-label">المظهر</div>
        <span class="settings-hint">وضع ليلي أو نهاري لكل الصفحات</span>
      </div>
      <div class="theme-toggle" role="group" aria-label="المظهر">
        <button type="button" id="themeDarkBtn">ليلي</button>
        <button type="button" id="themeLightBtn">نهاري</button>
      </div>
    </div>
  </div>

  <div class="settings-card">
    <div class="settings-row">
      <div>
        <div class="settings-label">إصدار التطبيق</div>
        <span class="settings-hint" id="buildHint">رقم البناء</span>
      </div>
      <div class="version-badge" id="versionBadge">v0.1.8</div>
    </div>
    <div class="settings-row">
      <div>
        <div class="settings-label">المنصة</div>
        <span class="settings-hint">ويب أو تطبيق أندرويد</span>
      </div>
      <div id="platformBadge" style="color:var(--muted);font-size:13px;font-weight:700">—</div>
    </div>
  </div>

  <div class="settings-card">
    <div class="settings-label" style="margin-bottom:8px">التحديثات</div>
    <span class="settings-hint" style="margin-bottom:12px;display:block">عند فتح التطبيق يظهر إشعار لو في نسخة أحدث. تقدر تبحث يدويًا من هنا.</span>
    <button type="button" id="checkUpdateBtn" class="update-btn">🔎 البحث عن تحديث</button>
    <div id="updateStatus" class="update-status"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-link"><span class="nav-icon">🔍</span>لوحة</a>
  <a href="chassis.html" class="nav-link"><span class="nav-icon">🔧</span>هيكل</a>
  <a href="history.html" class="nav-link"><span class="nav-icon">📋</span>سجل</a>
  <a href="settings.html" class="nav-link active"><span class="nav-icon">⚙️</span>إعدادات</a>
</nav>

<script>
  window.__LAMMAH_APP_SHELL__ = /^https?:\/\/localhost/i.test(location.origin) ||
    location.protocol === 'capacitor:' ||
    /android_asset/i.test(location.href);
</script>
<script src="db.js"></script>
<script src="update.js"></script>
<script>
(async function () {
  const darkBtn = document.getElementById('themeDarkBtn');
  const lightBtn = document.getElementById('themeLightBtn');
  const versionBadge = document.getElementById('versionBadge');
  const buildHint = document.getElementById('buildHint');
  const platformBadge = document.getElementById('platformBadge');
  const checkUpdateBtn = document.getElementById('checkUpdateBtn');
  const updateStatus = document.getElementById('updateStatus');

  function syncThemeButtons() {
    const theme = window.LammahTheme.getTheme();
    darkBtn.classList.toggle('active', theme === 'dark');
    lightBtn.classList.toggle('active', theme === 'light');
  }

  darkBtn.addEventListener('click', () => {
    window.LammahTheme.applyTheme('dark');
    syncThemeButtons();
  });
  lightBtn.addEventListener('click', () => {
    window.LammahTheme.applyTheme('light');
    syncThemeButtons();
  });
  syncThemeButtons();

  versionBadge.textContent = 'v' + (typeof APP_VERSION !== 'undefined' ? APP_VERSION : '0.1.8');
  buildHint.textContent = 'كود البناء ' + (typeof APP_VERSION_CODE !== 'undefined' ? APP_VERSION_CODE : '9');

  const isApp = window.LammahUpdate ? window.LammahUpdate.isAppShell() : !!window.__LAMMAH_APP_SHELL__;
  platformBadge.textContent = isApp ? 'تطبيق أندرويد' : 'موقع ويب';

  try {
    const info = await window.LammahUpdate.getLocalInfo();
    if (info.version) versionBadge.textContent = 'v' + info.version;
    if (info.build) buildHint.textContent = 'كود البناء ' + info.build;
  } catch (e) {}

  if (window.LammahUpdate) window.LammahUpdate.startAutoUpdateChecks();

  checkUpdateBtn.addEventListener('click', async () => {
    checkUpdateBtn.disabled = true;
    updateStatus.className = 'update-status';
    updateStatus.textContent = 'جارٍ البحث عن تحديث...';
    try {
      const result = await window.LammahUpdate.checkForUpdate({ force: true });
      if (result.status === 'update') {
        updateStatus.className = 'update-status warn';
        updateStatus.textContent = result.message + ' — اضغط «تحديث الآن» في الشريط أعلاه';
        if (result.remote && result.remote.apkUrl) {
          const download = document.createElement('button');
          download.type = 'button';
          download.className = 'update-btn';
          download.style.marginTop = '10px';
          download.textContent = '⬇️ تحميل التحديث';
          download.onclick = () => window.LammahUpdate.openApkUrl(result.remote.apkUrl);
          updateStatus.appendChild(document.createElement('br'));
          updateStatus.appendChild(download);
        }
      } else if (result.status === 'latest') {
        updateStatus.className = 'update-status ok';
        updateStatus.textContent = '✅ ' + result.message;
      } else if (result.status === 'web') {
        updateStatus.className = 'update-status';
        updateStatus.textContent = result.message;
      } else {
        updateStatus.className = 'update-status err';
        updateStatus.textContent = '⚠️ ' + result.message;
      }
    } catch (err) {
      updateStatus.className = 'update-status err';
      updateStatus.textContent = '⚠️ ' + (err.message || err);
    } finally {
      checkUpdateBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
